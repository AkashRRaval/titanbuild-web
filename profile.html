<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const loginTime = localStorage.getItem('loginTime');
        if (!isLoggedIn || !loginTime || (Date.now() - parseInt(loginTime)) > 30 * 60 * 1000) {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loginTime');
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24 font-sans">

    <!-- Profile Header Banner -->
    <div class="bg-gradient-to-r from-yellow-500 via-amber-500 to-yellow-600 text-black p-5 rounded-b-3xl shadow-2xl relative">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-14 h-14 bg-black rounded-full flex items-center justify-center border-2 border-yellow-300 shadow">
                    <i class="fa-solid fa-user-gear text-yellow-400 text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-lg font-black tracking-wide">+91 7359679116</h2>
                    <span class="bg-black text-yellow-400 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">VIP 1 MEMBER</span>
                </div>
            </div>
            <button onclick="logoutUser()" class="bg-black/20 hover:bg-black/40 text-black font-extrabold text-xs border border-black/30 px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
            </button>
        </div>

        <!-- Wallet Summary -->
        <div class="mt-5 bg-gray-900 text-white rounded-2xl p-4 border border-yellow-500/40 shadow-xl grid grid-cols-2 gap-4">
            <div>
                <p class="text-gray-400 text-xs font-semibold">Total Assets</p>
                <h3 class="text-xl font-black text-yellow-400 mt-1">₹ 0.00</h3>
            </div>
            <div class="border-l border-gray-800 pl-4">
                <p class="text-gray-400 text-xs font-semibold">Today Income</p>
                <h3 class="text-xl font-black text-green-400 mt-1">₹ 0.00</h3>
            </div>
        </div>
    </div>

    <!-- Quick Actions (Recharge / Withdraw) -->
    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <a href="recharge.html" class="bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm transition">
                <i class="fa-solid fa-wallet text-base"></i>
                <span>Recharge</span>
            </a>
            <button onclick="alert('Withdrawal System Available Soon!')" class="bg-gray-900 hover:bg-gray-800 text-gray-200 border border-gray-800 font-extrabold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2 text-sm transition">
                <i class="fa-solid fa-money-bill-transfer text-green-400 text-base"></i>
                <span>Withdraw</span>
            </button>
        </div>
                <!-- Menu List -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 divide-y divide-gray-800 shadow-xl text-sm">
            <a href="#" class="p-4 flex justify-between items-center hover:bg-gray-800/50 transition">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-truck-monster text-yellow-400 text-base"></i>
                    <span class="font-bold">My Machinery</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
            </a>

            <a href="recharge.html" class="p-4 flex justify-between items-center hover:bg-gray-800/50 transition">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-clock-rotate-left text-yellow-400 text-base"></i>
                    <span class="font-bold">Recharge & Income Record</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
            </a>

            <a href="team.html" class="p-4 flex justify-between items-center hover:bg-gray-800/50 transition">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-users text-yellow-400 text-base"></i>
                    <span class="font-bold">My Team / Referrals</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
            </a>

            <a href="#" class="p-4 flex justify-between items-center hover:bg-gray-800/50 transition">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-building-columns text-yellow-400 text-base"></i>
                    <span class="font-bold">Bank Account Details</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
            </a>
        </div>

        <!-- Referral Link Share Box -->
        <div class="bg-gray-900 p-4 rounded-2xl border border-yellow-500/20 shadow-xl space-y-2">
            <label class="block text-xs font-bold text-gray-400 uppercase">Your Referral Code</label>
            <div class="flex items-center space-x-2">
                <input type="text" value="TITAN8899" readonly class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-yellow-400 font-mono font-bold text-sm focus:outline-none">
                <button onclick="alert('Referral Code Copied!')" class="bg-yellow-500 hover:bg-yellow-600 text-black font-extrabold px-4 py-2.5 rounded-lg text-xs transition">Copy</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-950 border-t border-gray-800 flex justify-around p-3 text-center text-xs z-50">
        <a href="index.html" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-house text-lg mb-0.5"></i>
            <span>Home</span>
        </a>
        <a href="index.html#productsSection" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-truck-monster text-lg mb-0.5"></i>
            <span>Products</span>
        </a>
        <a href="team.html" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-users text-lg mb-0.5"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="text-yellow-400 font-bold flex flex-col items-center">
            <i class="fa-solid fa-user text-lg mb-0.5"></i>
            <span>My</span>
        </a>
    </nav>

    <script>
        function logoutUser() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loginTime');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
