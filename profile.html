<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 80px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        /* Top Corner Customer Service Button */
        .cs-top-btn {
            background: #1f2937;
            color: #fbbf24;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .cs-top-btn:hover {
            border-color: #fbbf24;
            background: #252f42;
        }
        .container {
            max-width: 480px;
            margin: 15px auto;
            padding: 0 15px;
        }
        .profile-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profile-info h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .profile-info p {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
        }
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .section-box {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section-box h3 {
            font-size: 14px;
            color: #fbbf24;
            margin-bottom: 12px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 8px;
        }
        .history-placeholder {
            color: #64748b;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1f2937;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item i {
            display: block;
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <!-- Header with Top Corner CS Button -->
    <div class="header">
        <span>USER PROFILE</span>
        <a href="cs.html" class="cs-top-btn">
            <i class="fas fa-headset"></i> Support
        </a>
    </div>

    <div class="container">
        <!-- Account Info Card -->
        <div class="profile-card">
            <div class="profile-info">
                <h3>ACCOUNT PHONE</h3>
                <p id="userPhoneDisplay">7359679116</p>
                <p style="font-size: 13px; color: #fbbf24; margin-top: 4px;">₹0.00</p>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>

        <!-- Leased Assets Section -->
        <div class="section-box">
            <h3>MY LEASED ASSETS</h3>
            <div class="history-placeholder">Loading assets...</div>
        </div>

        <!-- Recharge History Section -->
        <div class="section-box">
            <h3>RECHARGE HISTORY</h3>
            <div class="history-placeholder">Loading recharges...</div>
        </div>

        <!-- Withdrawal History Section -->
        <div class="section-box">
            <h3>WITHDRAWAL HISTORY</h3>
            <div class="history-placeholder">Loading withdrawals...</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="recharge.html" class="nav-item">
            <i class="fas fa-wallet"></i> Recharge
        </a>
        <a href="withdraw.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Withdraw
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fas fa-user"></i> Profile
        </a>
    </div>

    <script>
        // Load user phone from localStorage if available
        const savedPhone = localStorage.getItem('user_phone');
        if(savedPhone) {
            document.getElementById('userPhoneDisplay').innerText = savedPhone;
        }

        function logout() {
            localStorage.removeItem('user_phone');
            alert('Logged out successfully!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
