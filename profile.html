<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 80px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .container {
            max-width: 480px;
            margin: 15px auto;
            padding: 0 15px;
        }
        .profile-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .profile-avatar {
            width: 60px;
            height: 60px;
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 10px auto;
        }
        .menu-list {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #1f2937;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 13px;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-item-left i {
            color: #fbbf24;
            font-size: 16px;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1f2937;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item i {
            display: block;
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">
        My Profile
    </div>

    <div class="container">
        <!-- User Info Card -->
        <div class="profile-card">
            <div class="profile-avatar">
                <i class="fas fa-user"></i>
            </div>
            <h3 style="font-size: 15px; color: #fff; margin-bottom: 4px;">TitanUser</h3>
            <p style="font-size: 12px; color: #94a3b8;">Phone: +91 73596*****</p>
        </div>

        <!-- Menu Options -->
        <div class="menu-list">
            <!-- Recharge History Link -->
            <a href="recharge.html" class="menu-item">
                <div class="menu-item-left">
                    <i class="fas fa-wallet"></i>
                    <span>Recharge History</span>
                </div>
                <i class="fas fa-chevron-right" style="color: #64748b; font-size: 12px;"></i>
            </a>

            <!-- Withdrawal History Link -->
            <a href="withdraw.html" class="menu-item">
                <div class="menu-item-left">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Withdrawal History</span>
                </div>
                <i class="fas fa-chevron-right" style="color: #64748b; font-size: 12px;"></i>
            </a>

            <!-- Customer Support Link -->
            <a href="cs.html" class="menu-item">
                <div class="menu-item-left">
                    <i class="fas fa-headset"></i>
                    <span>Customer Support</span>
                </div>
                <i class="fas fa-chevron-right" style="color: #64748b; font-size: 12px;"></i>
            </a>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="recharge.html" class="nav-item">
            <i class="fas fa-wallet"></i> Recharge
        </a>
        <a href="withdraw.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Withdraw
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fas fa-user"></i> Profile
        </a>
    </div>

</body>
</html>
