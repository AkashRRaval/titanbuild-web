<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Profile & Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 70px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .container {
            max-width: 400px;
            margin: 15px auto;
            padding: 0 15px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .balance-card {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid #374151;
            text-align: center;
        }
        .balance-card h4 {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .balance-card h2 {
            color: #fbbf24;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-recharge {
            background: #fbbf24;
            color: #111827;
        }
        .btn-withdraw {
            background: #374151;
            color: #fff;
        }
        .card h3 {
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .btn-primary {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-top: 5px;
        }
        .bank-info {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed #fbbf24;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #fbbf24;
            text-align: center;
        }
        .menu-list {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .menu-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 14px;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item i:first-child {
            margin-right: 12px;
            color: #fbbf24;
            width: 20px;
        }
        .menu-item span {
            flex: 1;
        }
        .menu-item i:last-child {
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>My Profile & Wallet</span>
    </div>

    <div class="container">
        <!-- Wallet & Actions Card -->
        <div class="card balance-card">
            <h4>Wallet Balance (Daily Benefits Included)</h4>
            <h2 id="walletBalance">₹0.00</h2>
            <div class="btn-row">
                <button class="btn-recharge" onclick="window.location.href='recharge.html'">Recharge</button>
                <button class="btn-withdraw" onclick="checkWithdrawalLock()">Withdraw</button>
            </div>
        </div>

        <!-- Bank Card Binding Section -->
        <div class="card">
            <h3>Bank Card Binding</h3>
            <div id="boundBankInfo" style="display: none;" class="bank-info">
                Bank Bound Successfully!
            </div>
            <div id="bankForm">
                <div class="input-group">
                    <label>Account Holder Name</label>
                    <input type="text" id="accName" placeholder="Enter holder name">
                </div>
                <div class="input-group">
                    <label>Bank Account Number</label>
                    <input type="text" id="accNo" placeholder="Enter account number">
                </div>
                <div class="input-group">
                    <label>IFSC Code</label>
                    <input type="text" id="ifscCode" placeholder="Enter IFSC code">
                </div>
                <button class="btn-primary" onclick="bindBank()">Save & Bind Bank</button>
            </div>
        </div>

        <!-- History & Records Menu -->
        <div class="menu-list">
            <a href="recharge.html" class="menu-item">
                <i class="fas fa-history"></i>
                <span>Asset Purchases & Recharge History</span>
                <i class="fas fa-chevron-right"></i>
            </a>
            <a href="#" class="menu-item" onclick="alert('Daily benefits are active on your wallet cycle!')">
                <i class="fas fa-gift"></i>
                <span>Daily Benefits Status</span>
                <i class="fas fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <script>
        function bindBank() {
            const name = document.getElementById('accName').value.trim();
            const acc = document.getElementById('accNo').value.trim();
            const ifsc = document.getElementById('ifscCode').value.trim();

            if(!name || !acc || !ifsc) {
                alert("Please fill in all bank details to bind!");
                return;
            }

            alert("Bank account bound successfully!");
            document.getElementById('bankForm').style.display = 'none';
            document.getElementById('boundBankInfo').style.display = 'block';
            document.getElementById('boundBankInfo').innerText = `Bound Bank: ${name} (${acc})`;
        }

        function checkWithdrawalLock() {
            let cycleCompleted = false; // Change to true when cycle finishes
            if(!cycleCompleted) {
                alert("Withdrawal is locked until your investment cycle completes!");
            } else {
                let buyCard = confirm("Cycle completed! Please purchase an ATM Card to unlock your withdrawal limit.");
                if(buyCard) {
                    alert("Redirecting to ATM Card purchase gateway...");
                }
            }
        }
    </script>
</body>
</html>
