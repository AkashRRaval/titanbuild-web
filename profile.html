<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            const userPhone = localStorage.getItem('userPhone');
            if (!userPhone) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('profilePhone').innerText = userPhone;
            try {
                const userRef = doc(db, "users", userPhone);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('profileBalance').innerText = '₹' + (data.balance || 0).toFixed(2);
                    document.getElementById('profileLocked').innerText = '₹' + (data.lockedEarnings || 0).toFixed(2);
                }
            } catch (e) {
                console.error("Error loading profile data:", e);
            }
        });

        window.logoutUser = function() {
            localStorage.removeItem('userPhone');
            window.location.href = 'login.html';
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24 font-sans">

    <!-- Top Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-yellow-600 to-amber-400 rounded-xl flex items-center justify-center text-black font-black shadow-lg">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-base font-black tracking-wider text-yellow-400 uppercase">MY PROFILE</h1>
        </div>
        <button onclick="logoutUser()" class="bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-xl text-xs font-bold transition">
            <i class="fa-solid fa-power-off mr-1"></i> Logout
        </button>
    </div>
       <div class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- User Info Card -->
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-3xl shadow-xl space-y-4">
            <div class="flex items-center space-x-4">
                <div class="w-14 h-14 bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 rounded-2xl flex items-center justify-center text-2xl font-black">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <span class="text-[9px] text-gray-500 font-bold uppercase block tracking-wider">Registered Account</span>
                    <h2 id="profilePhone" class="text-base font-black text-white mt-0.5">Loading...</h2>
                    <span class="inline-block bg-green-500/10 border border-green-500/30 text-green-400 text-[9px] px-2 py-0.5 rounded-full font-bold mt-1">Verified Member</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-800">
                <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800/60">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block">Main Wallet</span>
                    <h3 id="profileBalance" class="text-lg font-black text-yellow-400 mt-0.5">₹0.00</h3>
                </div>
                <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800/60">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block">Locked Earnings</span>
                    <h3 id="profileLocked" class="text-lg font-black text-amber-400 mt-0.5">₹0.00</h3>
                </div>
            </div>
        </div>

        <!-- Quick Options Menu -->
        <div class="bg-gray-900 border border-gray-800 rounded-3xl overflow-hidden shadow-xl">
            <a href="recharge.html" class="flex items-center justify-between p-4 border-b border-gray-800/80 hover:bg-gray-800/40 transition">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-yellow-500/10 text-yellow-400 rounded-xl flex items-center justify-center text-sm">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <span class="text-xs font-bold text-white">Recharge Funds</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
            </a>

            <a href="withdraw.html" class="flex items-center justify-between p-4 border-b border-gray-800/80 hover:bg-gray-800/40 transition">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-green-500/10 text-green-400 rounded-xl flex items-center justify-center text-sm">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </div>
                    <span class="text-xs font-bold text-white">Withdraw Earnings</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
            </a>

            <div class="flex items-center justify-between p-4">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-sm">
                        <i class="fa-solid fa-headset"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-white block">Customer Support</span>
                        <span class="text-[10px] text-gray-500">Available 24/7 via Telegram</span>
                    </div>
                </div>
                <span class="text-[10px] font-bold text-yellow-400 bg-yellow-500/10 px-2.5 py-1 rounded-xl border border-yellow-500/20">Online</span>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto shadow-2xl">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
                </html>
