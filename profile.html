<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #6b1414; /* Dark red theme as per your screenshot */
            color: #fff;
            padding-bottom: 90px;
        }
        .header {
            background: #540e0e;
            color: #ffbc36;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #7c1a1a;
        }
        .container {
            padding: 15px;
        }
        .user-card {
            background: #540e0e;
            border: 1px solid #7c1a1a;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            background: #ff7700;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }
        .user-info .phone {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }
        .user-info .balance {
            font-size: 14px;
            color: #ffbc36;
        }
        
        /* Action Buttons Grid (Recharge & Withdraw) */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .action-btn {
            background: #540e0e;
            border: 1px solid #7c1a1a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .action-btn i {
            font-size: 24px;
            color: #ff7700;
        }

        /* Menu List (Screenshot wale exact purane options) */
        .menu-list {
            background: #540e0e;
            border: 1px solid #7c1a1a;
            border-radius: 12px;
            overflow: hidden;
        }
        .menu-item {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #7c1a1a;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item div {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-item i {
            color: #ff7700;
            font-size: 16px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-content {
            background: #540e0e;
            border: 1px solid #7c1a1a;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffbc36;
            margin-bottom: 15px;
            text-align: center;
        }
        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #ffd27f;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background: #3c0808;
            border: 1px solid #7c1a1a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ff7700;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        
        /* Channel List inside Recharge Modal */
        .channel-btn {
            background: #3c0808;
            border: 1px solid #7c1a1a;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }

        /* QR Code Container */
        .qr-container {
            text-align: center;
            display: none;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            margin: 15px 0;
            background: #fff;
            padding: 5px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #540e0e;
            border-top: 1px solid #7c1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none;
            color: #ffa8a8;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
        }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #ffbc36; }
    </style>
</head>
<body>

    <div class="header">My Profile</div>

    <div class="container">
        <!-- User Info Card -->
        <div class="user-card">
            <div class="user-avatar" id="userInitial">9</div>
            <div class="user-info">
                <div class="phone" id="userPhoneDisplay">9876543210</div>
                <div class="balance">Balance: ₹<span id="userBalance">1000</span></div>
            </div>
        </div>

        <!-- Recharge & Withdraw Grid -->
        <div class="action-grid">
            <div class="action-btn" onclick="openRechargeModal()">
                <i class="fas fa-wallet"></i>
                <span>Recharge</span>
            </div>
            <div class="action-btn" onclick="openWithdrawModal()">
                <i class="fas fa-money-bill-wave"></i>
                <span>Withdraw</span>
            </div>
        </div>

        <!-- Menu List (Purane options bilkul waise hi rakhe hain) -->
        <div class="menu-list">
            <a href="#" class="menu-item">
                <div><i class="fas fa-history"></i> Recharge History</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #ffa8a8;"></i>
            </a>
            <a href="#" class="menu-item">
                <div><i class="fas fa-exchange-alt"></i> Withdrawal History</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #ffa8a8;"></i>
            </a>
            <a href="#" class="menu-item" onclick="logout()">
                <div><i class="fas fa-sign-out-alt"></i> Logout</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #ffa8a8;"></i>
            </a>
        </div>
    </div>

    <!-- Recharge Modal with Channel 1 & Channel 2 -->
    <div class="modal" id="rechargeModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeRechargeModal()">&times;</span>
            <div class="modal-title">Select Recharge Channel</div>
            
            <div id="channelSelection">
                <div class="channel-btn" onclick="selectChannel('Channel 1')">Channel 1 (UPI QR)</div>
                <div class="channel-btn" onclick="selectChannel('Channel 2')">Channel 2 (Fast QR)</div>
            </div>

            <div class="qr-container" id="qrContainer">
                <p style="font-size: 13px; color: #ffd27f;" id="selectedChannelTitle"></p>
                <!-- Apni QR code image ka link yahan daal sakta hai -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=yourupi@oksbi&pn=TitanBuild" alt="Payment QR Code" id="qrImage">
                <p style="font-size: 11px; color: #ffbc36; margin-top: 5px;">Scan QR code to pay, then enter UTR below</p>
                
                <div class="form-group" style="margin-top: 15px;">
                    <input type="text" class="form-control" id="utrNumber" placeholder="Enter 12-digit UTR / Ref Number">
                </div>
                <button class="btn-submit" onclick="submitRecharge()">Submit Payment</button>
                <button style="background: transparent; border: none; color: #ffa8a8; font-size: 12px; margin-top: 10px; cursor: pointer; width: 100%;" onclick="backToChannels()">Back to Channels</button>
            </div>
        </div>
    </div>

    <!-- Withdrawal Modal -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeWithdrawModal()">&times;</span>
            <div class="modal-title">Withdraw Funds</div>
            <div class="form-group">
                <label>Withdrawal Amount (₹)</label>
                <input type="number" class="form-control" id="withdrawAmount" placeholder="Enter amount">
            </div>
            <div class="form-group">
                <label>Bank UPI ID / Account Number</label>
                <input type="text" class="form-control" id="bankDetails" placeholder="Enter UPI ID or Bank A/C">
            </div>
            <div class="form-group">
                <label>Fund Password</label>
                <input type="password" class="form-control" id="fundPassword" placeholder="Enter withdrawal password">
            </div>
            <button class="btn-submit" onclick="submitWithdrawal()">Confirm Withdrawal</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="invest.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Invest</span>
        </a>
        <a href="team.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        window.onload = function() {
            let phone = localStorage.getItem('userPhone') || '9876543210';
            document.getElementById('userPhoneDisplay').innerText = phone;
            document.getElementById('userInitial').innerText = phone.charAt(0);

            let balance = localStorage.getItem('userBalance') || '1000';
            document.getElementById('userBalance').innerText = balance;
        };

        function openRechargeModal() {
            document.getElementById('rechargeModal').style.display = 'flex';
            document.getElementById('channelSelection').style.display = 'block';
            document.getElementById('qrContainer').style.display = 'none';
        }
        function closeRechargeModal() {
            document.getElementById('rechargeModal').style.display = 'none';
        }
        function selectChannel(channelName) {
            document.getElementById('channelSelection').style.display = 'none';
            document.getElementById('qrContainer').style.display = 'block';
            document.getElementById('selectedChannelTitle').innerText = "Pay via " + channelName;
        }
        function backToChannels() {
            document.getElementById('channelSelection').style.display = 'block';
            document.getElementById('qrContainer').style.display = 'none';
        }
        function submitRecharge() {
            let utr = document.getElementById('utrNumber').value;
            if(utr.length < 8) {
                alert("Please enter a valid UTR / Transaction reference number.");
                return;
            }
            alert("Recharge request submitted successfully! Pending verification.");
            closeRechargeModal();
        }

        function openWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'flex';
        }
        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }
        function submitWithdrawal() {
            let amount = parseFloat(document.getElementById('withdrawAmount').value);
            let currentBalance = parseFloat(localStorage.getItem('userBalance') || '1000');
            
            if(!amount || amount <= 0) {
                alert("Please enter a valid withdrawal amount.");
                return;
            }
            if(amount > currentBalance) {
                alert("Insufficient balance!");
                return;
            }
            
            currentBalance -= amount;
            localStorage.setItem('userBalance', currentBalance.toFixed(2));
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
            
            alert("Withdrawal request submitted successfully!");
            closeWithdrawModal();
        }

        function logout() {
            localStorage.removeItem('userPhone');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
