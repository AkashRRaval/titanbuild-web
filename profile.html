<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 80px; /* Footer ke liye space */
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .user-card {
            background: linear-gradient(135deg, #111827, #1f2937);
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            background: #fbbf24;
            color: #111827;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        .user-info h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .user-info p {
            color: #94a3b8;
            font-size: 12px;
        }
        .balance-section {
            background: #111827;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            text-align: center;
        }
        .bal-item h4 {
            color: #fbbf24;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .bal-item span {
            color: #94a3b8;
            font-size: 12px;
        }
        .menu-list {
            margin: 15px;
            background: #111827;
            border-radius: 12px;
            border: 1px solid #1f2937;
            overflow: hidden;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            color: #e2e8f0;
            text-decoration: none;
            border-bottom: 1px solid #1f2937;
            transition: background 0.2s;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item:active {
            background: #1f2937;
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .menu-left i {
            color: #fbbf24;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .menu-item i.fa-chevron-right {
            color: #6b7280;
            font-size: 12px;
        }
        .logout-btn {
            margin: 15px;
            background: #ef4444;
            color: #fff;
            border: none;
            width: calc(100% - 30px);
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }

        /* Bottom Navigation Menu Bar Style */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
            transition: color 0.2s;
        }
        .nav-item i {
            font-size: 18px;
        }
        .nav-item.active, .nav-item:hover {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">My Profile</div>

    <!-- User Details Card -->
    <div class="user-card">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="user-info">
            <h3 id="usernameDisplay">Titan User</h3>
            <p>Phone: +91 ******9999</p>
        </div>
    </div>

    <!-- Balance Section -->
    <div class="balance-section">
        <div class="bal-item">
            <h4 id="userBalance">₹500.00</h4>
            <span>Total Balance</span>
        </div>
        <div style="width: 1px; background: #374151;"></div>
        <div class="bal-item">
            <h4 id="userIncome">₹150.00</h4>
            <span>Total Income</span>
        </div>
    </div>

    <!-- Navigation Menu Options -->
    <div class="menu-list">
        <a href="withdraw-info.html" class="menu-item">
            <div class="menu-left">
                <i class="fas fa-id-card"></i>
                <span>Withdrawal Information (Bank Bind)</span>
            </div>
            <i class="fas fa-chevron-right"></i>
        </a>

        <a href="my-products.html" class="menu-item">
            <div class="menu-left">
                <i class="fas fa-box-open"></i>
                <span>My Products</span>
            </div>
            <i class="fas fa-chevron-right"></i>
        </a>

        <a href="my-bills.html" class="menu-item">
            <div class="menu-left">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>My Bills / Records</span>
            </div>
            <i class="fas fa-chevron-right"></i>
        </a>

        <a href="about.html" class="menu-item">
            <div class="menu-left">
                <i class="fas fa-info-circle"></i>
                <span>About Us</span>
            </div>
            <i class="fas fa-chevron-right"></i>
        </a>
    </div>

    <button class="logout-btn" onclick="logoutUser()">Log Out</button>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="invest.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Invest</span>
        </a>
        <a href="team.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        function logoutUser() {
            if(confirm("Kya aap sach mein logout karna chahte hain?")) {
                localStorage.clear();
                alert("Logged out successfully!");
                // window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
