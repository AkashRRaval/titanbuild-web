<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5TOY2RYSYrxvugtDF1F2x79GMAjyzPYw",
            authDomain: "safargo-55e25.firebaseapp.com",
            projectId: "safargo-55e25",
            storageBucket: "safargo-55e25.firebasestorage.app",
            messagingSenderId: "812165464390",
            appId: "1:812165464390:web:cfb18865e8af5f5b24a547"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const loginTime = localStorage.getItem('loginTime');
        const userPhone = localStorage.getItem('userPhone');

        if (!isLoggedIn || !loginTime || (Date.now() - parseInt(loginTime)) > 30 * 60 * 1000) {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loginTime');
            localStorage.removeItem('userPhone');
            window.location.href = "login.html";
        }

        // Fetch live user data from Firestore
        window.addEventListener('DOMContentLoaded', async () => {
            if (userPhone) {
                document.getElementById('displayPhone').innerText = '+91 ' + userPhone;
                try {
                    const userRef = doc(db, "users", userPhone);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        document.getElementById('userBalance').innerText = '₹' + (data.balance || 0);
                        document.getElementById('todayIncome').innerText = '₹' + (data.todayIncome || 0);
                    }
                } catch (e) {
                    console.error("Error loading profile data:", e);
                }
            }
        });

        window.logout = function() {
            localStorage.clear();
            alert('Logged out successfully!');
            window.location.href = 'login.html';
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 text-center sticky top-0 z-50">
        <h1 class="text-lg font-black tracking-wider text-yellow-400 uppercase">My Profile</h1>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-5">
        <!-- User Info Card -->
        <div class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl flex items-center space-x-4">
            <div class="w-14 h-14 bg-yellow-500 text-black font-black text-2xl rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <p id="displayPhone" class="text-base font-black text-white">+91 9876543210</p>
                <span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full inline-block mt-1">
                    Active Member
                </span>
            </div>
        </div>

        <!-- Balance & Income Box -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 shadow-xl space-y-1">
                <p class="text-[10px] text-gray-400 font-bold uppercase">Total Balance</p>
                <h2 id="userBalance" class="text-xl font-black text-yellow-400">₹0</h2>
            </div>
            <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 shadow-xl space-y-1">
                <p class="text-[10px] text-gray-400 font-bold uppercase">Today Income</p>
                <h2 id="todayIncome" class="text-xl font-black text-green-400">₹0</h2>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden divide-y divide-gray-800">
            <a href="recharge.html" class="flex items-center justify-between p-4 hover:bg-gray-800/50 transition">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-yellow-500/10 text-yellow-400 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-wallet text-sm"></i>
                    </div>
                    <span class="text-sm font-bold text-white">Recharge Account</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
            </a>

            <a href="withdraw.html" class="flex items-center justify-between p-4 hover:bg-gray-800/50 transition">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-yellow-500/10 text-yellow-400 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-money-bill-transfer text-sm"></i>
                    </div>
                    <span class="text-sm font-bold text-white">Withdraw Money</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs"></i>
            </a>
        </div>

        <!-- Logout Button -->
        <button onclick="logout()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-black py-3.5 rounded-2xl text-sm transition uppercase tracking-wide">
            <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
        </button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
</html>
