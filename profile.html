<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - User Profile & History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userPhone = localStorage.getItem('userPhone');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!userPhone) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('displayPhone').innerText = userPhone;
            document.getElementById('userPhoneCard').innerText = userPhone;

            try {
                // Fetch User Balance
                const userRef = doc(db, "users", userPhone);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const balance = userSnap.data().balance || 0;
                    document.getElementById('walletBalance').innerText = '₹' + balance.toFixed(2);
                }

                // Fetch User Purchases / Investments
                const purchasesRef = collection(db, "purchases");
                const qPurchases = query(purchasesRef, where("phone", "==", userPhone));
                const purchaseSnapshot = await getDocs(qPurchases);
                const purchasesList = document.getElementById('purchasesList');
                purchasesList.innerHTML = "";

                if (purchaseSnapshot.empty) {
                    purchasesList.innerHTML = `<div class="text-center py-4 text-gray-500 text-xs">No active asset leases found.</div>`;
                } else {
                    purchaseSnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        purchasesList.innerHTML += `
                            <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800 space-y-1">
                                <div class="flex justify-between items-center text-xs">
                                    <strong class="text-yellow-400">${data.assetName}</strong>
                                    <span class="text-[10px] text-green-400 bg-green-950/40 px-2 py-0.5 rounded-full border border-green-500/30">${data.status || 'Active'}</span>
                                </div>
                                <div class="flex justify-between text-[11px] text-gray-400">
                                    <span>Price: ₹${data.price}</span>
                                    <span class="text-green-400 font-bold">+₹${data.dailyReturn} / day</span>
                                </div>
                                <div class="text-[9px] text-gray-500 font-mono">Order ID: ${data.orderNo || 'N/A'}</div>
                            </div>
                        `;
                    });
                }

                // Fetch Recharges History
                const rechargesRef = collection(db, "recharges");
                const qRecharges = query(rechargesRef, where("phone", "==", userPhone));
                const rechargeSnapshot = await getDocs(qRecharges);
                const rechargesList = document.getElementById('rechargesList');
                rechargesList.innerHTML = "";

                if (rechargeSnapshot.empty) {
                    rechargesList.innerHTML = `<div class="text-center py-4 text-gray-500 text-xs">No recharge history found.</div>`;
                } else {
                    rechargeSnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        rechargesList.innerHTML += `
                            <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800 flex justify-between items-center text-xs">
                                <div>
                                    <strong class="text-yellow-400 block">+₹${data.amount}</strong>
                                    <span class="text-[9px] text-gray-500 font-mono">UTR: ${data.utrNumber}</span>
                                    <span class="text-[9px] text-gray-600 block font-mono">ID: ${data.orderNo}</span>
                                </div>
                                <span class="text-[10px] text-green-400 bg-green-950/40 px-2 py-0.5 rounded-full border border-green-500/30">${data.status}</span>
                            </div>
                        `;
                    });
                }

                // Fetch Withdrawals History
                const withdrawalsRef = collection(db, "withdrawals");
                const qWithdrawals = query(withdrawalsRef, where("phone", "==", userPhone));
                const withdrawalSnapshot = await getDocs(qWithdrawals);
                const withdrawalsList = document.getElementById('withdrawalsList');
                withdrawalsList.innerHTML = "";

                if (withdrawalSnapshot.empty) {
                    withdrawalsList.innerHTML = `<div class="text-center py-4 text-gray-500 text-xs">No withdrawal history found.</div>`;
                } else {
                    withdrawalSnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        withdrawalsList.innerHTML += `
                            <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800 flex justify-between items-center text-xs">
                                <div>
                                    <strong class="text-red-400 block">-₹${data.amount}</strong>
                                    <span class="text-[9px] text-gray-500 font-mono">UPI: ${data.upiId}</span>
                                    <span class="text-[9px] text-gray-600 block font-mono">ID: ${data.orderNo}</span>
                                </div>
                                <span class="text-[10px] text-yellow-400 bg-yellow-950/40 px-2 py-0.5 rounded-full border border-yellow-500/30">${data.status}</span>
                            </div>
                        `;
                    });
                }

            } catch (e) {
                console.error("Error loading profile data:", e);
            }
        });

        window.logout = function() {
            localStorage.removeItem('userPhone');
            window.location.href = 'login.html';
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24 font-sans">

    <!-- Top Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-yellow-600 to-amber-400 rounded-xl flex items-center justify-center text-black font-black shadow-lg">
                <i class="fa-solid fa-user"></i>
            </div>
            <h1 class="text-base font-black tracking-wider text-yellow-400 uppercase">USER PROFILE</h1>
        </div>
        <div class="text-right">
            <span id="displayPhone" class="text-[10px] text-gray-400 block font-bold">Loading...</span>
        </div>
    </div>
        <div class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- User Info Card -->
        <div class="bg-gradient-to-br from-gray-900 to-gray-900 p-5 rounded-3xl border border-yellow-500/30 shadow-2xl flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-yellow-500/20 border border-yellow-500/40 rounded-2xl flex items-center justify-center text-yellow-400 text-xl font-black">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <span class="text-[9px] text-gray-400 uppercase tracking-wider block font-bold">Account Phone</span>
                    <h3 id="userPhoneCard" class="text-sm font-black text-white">Loading...</h3>
                    <p id="walletBalance" class="text-xs font-black text-yellow-400 mt-0.5">₹0.00</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-2 rounded-xl text-xs font-black transition uppercase">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <!-- Active Leased Assets History -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-3xl shadow-xl space-y-3">
            <h3 class="text-xs font-black text-yellow-400 uppercase tracking-widest"><i class="fa-solid fa-toolbox mr-1"></i> My Leased Assets</h3>
            <div id="purchasesList" class="space-y-2">
                <div class="text-center py-3 text-gray-500 text-xs">Loading assets...</div>
            </div>
        </div>

        <!-- Recharge History -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-3xl shadow-xl space-y-3">
            <h3 class="text-xs font-black text-yellow-400 uppercase tracking-widest"><i class="fa-solid fa-wallet mr-1"></i> Recharge History</h3>
            <div id="rechargesList" class="space-y-2">
                <div class="text-center py-3 text-gray-500 text-xs">Loading recharges...</div>
            </div>
        </div>

        <!-- Withdrawal History -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-3xl shadow-xl space-y-3">
            <h3 class="text-xs font-black text-yellow-400 uppercase tracking-widest"><i class="fa-solid fa-arrow-right-arrow-left mr-1"></i> Withdrawal History</h3>
            <div id="withdrawalsList" class="space-y-2">
                <div class="text-center py-3 text-gray-500 text-xs">Loading withdrawals...</div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto shadow-2xl">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
</html>
