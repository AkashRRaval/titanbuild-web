<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding: 20px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
            border-radius: 10px 10px 0 0;
            margin-bottom: 20px;
        }
        .admin-section {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .admin-header h3 {
            color: #fbbf24;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #374151;
            padding-bottom: 10px;
        }
        .admin-content-grid {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .users-list-box {
            width: 35%;
            background: #1f2937;
            border-radius: 8px;
            padding: 12px;
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #374151;
        }
        .users-list-box h4 {
            font-size: 13px;
            color: #fbbf24;
            margin-bottom: 10px;
            border-bottom: 1px solid #374151;
            padding-bottom: 5px;
        }
        .user-btn-item {
            padding: 10px;
            background: #111827;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #e2e8f0;
            border: 1px solid #374151;
            transition: 0.2s;
        }
        .user-btn-item:hover {
            border-color: #fbbf24;
            background: #1a2234;
        }
        .chat-thread-box {
            width: 65%;
            background: #1f2937;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #374151;
            height: 450px;
        }
        #chatHeaderInfo {
            font-size: 13px;
            color: #94a3b8;
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        #adminChatMessages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }
        .msg-bubble {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            font-size: 12px;
            line-height: 1.4;
        }
        .msg-bubble.user {
            background: #fbbf24;
            color: #111827;
            align-self: flex-end;
            font-weight: 500;
        }
        .msg-bubble.bot {
            background: #374151;
            color: #e2e8f0;
            align-self: flex-start;
        }
        .time-text {
            font-size: 9px;
            opacity: 0.7;
            text-align: right;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="admin-section">
        <div class="header" style="margin: 0 0 15px 0; border-radius: 6px;">
            TitanBuild Admin Panel
        </div>

        <div class="admin-header">
            <h3><i class="fas fa-headset"></i> User Complaints & Live Chats</h3>
        </div>
        
        <div class="admin-content-grid">
            <!-- Left Side: User IDs List -->
            <div class="users-list-box">
                <h4>Active Users</h4>
                <div id="adminUsersList">
                    <div style="color: #64748b; font-size: 12px; text-align: center; padding: 20px;">Loading...</div>
                </div>
            </div>

            <!-- Right Side: Selected User Chat Thread -->
            <div class="chat-thread-box">
                <div id="chatHeaderInfo">
                    Select a user to view chat
                </div>
                
                <div id="adminChatMessages">
                    <div style="color: #64748b; text-align: center; margin-top: 150px; font-size: 13px;">No chat selected</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadAdminComplaints() {
            const complaints = JSON.parse(localStorage.getItem('admin_complaints')) || [];
            const usersListDiv = document.getElementById('adminUsersList');
            usersListDiv.innerHTML = '';

            if (complaints.length === 0) {
                usersListDiv.innerHTML = '<div style="color: #64748b; font-size: 12px; text-align: center; padding: 20px;">No complaints yet</div>';
                return;
            }

            complaints.forEach((thread) => {
                const userBtn = document.createElement('div');
                userBtn.className = 'user-btn-item';
                userBtn.innerHTML = `<i class="fas fa-user-circle" style="color: #fbbf24; margin-right: 5px;"></i> ${thread.userId}`;
                userBtn.onclick = () => openUserChat(thread);
                usersListDiv.appendChild(userBtn);
            });
        }

        function openUserChat(thread) {
            document.getElementById('chatHeaderInfo').innerHTML = `Chat with: <span style="color: #fbbf24; font-weight: bold;">${thread.userId}</span>`;
            const chatBox = document.getElementById('adminChatMessages');
            chatBox.innerHTML = '';

            thread.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                // Check if message is from user or bot/admin
                if (msg.sender === 'user') {
                    msgDiv.className = 'msg-bubble user';
                } else {
                    msgDiv.className = 'msg-bubble bot';
                }
                msgDiv.innerHTML = `${msg.text} <div class="time-text">${msg.time}</div>`;
                chatBox.appendChild(msgDiv);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Load list on page start
        window.onload = function() {
            loadAdminComplaints();
        };
    </script>
</body>
</html>
