<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allRecharges = [];
        let allWithdrawals = [];

        window.checkAdminLogin = function() {
            const pass = document.getElementById('adminPassword').value.trim();
            if (pass === "DEVU9099") {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('Incorrect Admin Password! Try again.');
            }
        };

        async function loadAdminData() {
            try {
                // Load Recharges
                const recSnap = await getDocs(collection(db, "recharges"));
                allRecharges = [];
                recSnap.forEach(d => allRecharges.push({ id: d.id, ...d.data() }));

                // Load Withdrawals
                const witSnap = await getDocs(collection(db, "withdrawals"));
                allWithdrawals = [];
                witSnap.forEach(d => allWithdrawals.push({ id: d.id, ...d.data() }));

                renderRecharges(allRecharges);
                renderWithdrawals(allWithdrawals);
            } catch (e) {
                console.error("Error loading admin data:", e);
            }
        }

        window.filterData = function() {
            const queryText = document.getElementById('searchInput').value.toLowerCase().trim();

            const filteredRec = allRecharges.filter(r => 
                (r.phone && r.phone.toLowerCase().includes(queryText)) ||
                (r.orderNo && r.orderNo.toLowerCase().includes(queryText)) ||
                (r.utrNumber && r.utrNumber.toLowerCase().includes(queryText))
            );

            const filteredWit = allWithdrawals.filter(w => 
                (w.phone && w.phone.toLowerCase().includes(queryText)) ||
                (w.orderNo && w.orderNo.toLowerCase().includes(queryText)) ||
                (w.bankAccount && w.bankAccount.toLowerCase().includes(queryText))
            );

            renderRecharges(filteredRec);
            renderWithdrawals(filteredWit);
        };

        function renderRecharges(dataList) {
            const container = document.getElementById('rechargesTable');
            container.innerHTML = "";
            if (dataList.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-gray-500 text-xs">No recharges found.</div>`;
                return;
            }
            dataList.forEach(item => {
                container.innerHTML += `
                    <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800 space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-yellow-400 font-bold">${item.phone}</span>
                            <span class="text-green-400 font-black">+₹${item.amount}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 space-y-0.5 font-mono">
                            <div>Order ID: ${item.orderNo || 'N/A'}</div>
                            <div>UTR: ${item.utrNumber || 'N/A'}</div>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <span class="text-[10px] text-yellow-400 bg-yellow-950/40 px-2 py-0.5 rounded-full border border-yellow-500/30">${item.status}</span>
                            ${item.status === 'Pending' ? `<button onclick="updateStatus('recharges', '${item.id}', 'Successful')" class="bg-green-500/20 text-green-400 border border-green-500/30 px-3 py-1 rounded-xl text-[10px] font-black uppercase">Approve</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function renderWithdrawals(dataList) {
            const container = document.getElementById('withdrawalsTable');
            container.innerHTML = "";
            if (dataList.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-gray-500 text-xs">No withdrawals found.</div>`;
                return;
            }
            dataList.forEach(item => {
                container.innerHTML += `
                    <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800 space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-yellow-400 font-bold">${item.phone}</span>
                            <span class="text-red-400 font-black">-₹${item.amount}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 space-y-0.5 font-mono">
                            <div>Order ID: ${item.orderNo || 'N/A'}</div>
                            <div>Bank A/C: ${item.bankAccount || 'N/A'} | IFSC: ${item.ifsc || 'N/A'}</div>
                            <div>Name: ${item.holderName || 'N/A'}</div>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <span class="text-[10px] text-yellow-400 bg-yellow-950/40 px-2 py-0.5 rounded-full border border-yellow-500/30">${item.status}</span>
                            ${item.status === 'Pending' ? `<button onclick="updateStatus('withdrawals', '${item.id}', 'Approved')" class="bg-green-500/20 text-green-400 border border-green-500/30 px-3 py-1 rounded-xl text-[10px] font-black uppercase">Approve</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        window.updateStatus = async function(collectionName, docId, newStatus) {
            try {
                await updateDoc(doc(db, collectionName, docId), { status: newStatus });
                alert('Status updated to ' + newStatus);
                loadAdminData();
            } catch (e) {
                console.error("Error updating status:", e);
                alert('Failed to update status.');
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">
    
    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-yellow-500/30 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl text-center">
            <div class="w-12 h-12 bg-yellow-500/20 border border-yellow-500/40 rounded-2xl flex items-center justify-center text-yellow-400 text-xl font-black mx-auto">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-base font-black text-yellow-400 uppercase tracking-wider">Admin Verification</h2>
                <p class="text-[11px] text-gray-400 mt-1">Enter admin password to access the panel.</p>
            </div>
            <input type="password" id="adminPassword" placeholder="Enter password" class="w-full bg-gray-950 border border-gray-800 rounded-2xl py-3 px-4 text-sm text-white focus:outline-none focus:border-yellow-500 font-bold text-center tracking-widest">
            <button onclick="checkAdminLogin()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-600 hover:to-amber-600 text-black font-black py-3 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg">
                LOGIN TO PANEL
            </button>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden by default until password is correct) -->
    <div id="adminDashboard" class="hidden max-w-md mx-auto p-4 space-y-5">
        
        <!-- Header -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-3xl flex justify-between items-center shadow-xl">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-yellow-500/20 border border-yellow-500/40 rounded-xl flex items-center justify-center text-yellow-400 font-black">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-sm font-black tracking-wider text-yellow-400 uppercase">ADMIN CONTROL</h1>
            </div>
            <button onclick="location.reload()" class="bg-gray-950 border border-gray-800 hover:border-red-500 text-red-400 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase">
                <i class="fa-solid fa-power-off mr-1"></i> Lock
            </button>
        </div>

        <!-- Universal Search Bar -->
        <div class="bg-gray-900 border border-gray-800 p-3 rounded-3xl shadow-xl">
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-yellow-400 text-sm"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchInput" oninput="filterData()" placeholder="Search Phone, Order No, UTR or Bank A/C..." class="w-full bg-gray-950 border border-gray-800 rounded-2xl py-3 pl-10 pr-4 text-xs text-white focus:outline-none focus:border-yellow-500 font-bold">
            </div>
        </div>

        <!-- Recharges Management Section -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-3xl shadow-xl space-y-3">
            <h3 class="text-xs font-black text-yellow-400 uppercase tracking-widest"><i class="fa-solid fa-wallet mr-1"></i> Customer Recharges</h3>
            <div id="rechargesTable" class="space-y-2">
                <div class="p-4 text-center text-gray-500 text-xs">Loading recharges...</div>
            </div>
        </div>

        <!-- Withdrawals Management Section -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-3xl shadow-xl space-y-3">
            <h3 class="text-xs font-black text-yellow-400 uppercase tracking-widest"><i class="fa-solid fa-arrow-right-arrow-left mr-1"></i> Withdrawal Requests</h3>
            <div id="withdrawalsTable" class="space-y-2">
                <div class="p-4 text-center text-gray-500 text-xs">Loading withdrawals...</div>
            </div>
        </div>

    </div>

</body>
</html>
