<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        /* Admin Tabs */
        .admin-tabs {
            display: flex;
            background: #111827;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1f2937;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background: #fbbf24;
            color: #111827;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Live Chat Admin Box */
        .chat-box-admin {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .messages-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        .admin-msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .admin-msg.user {
            background: #1f2937;
            color: #fff;
            align-self: flex-start;
            border: 1px solid #374151;
        }
        .admin-msg.admin {
            background: #fbbf24;
            color: #111827;
            align-self: flex-end;
        }
        .admin-msg img, .admin-msg video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
        }
        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            margin-top: 5px;
        }
        /* Reply Bar */
        .reply-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #1f2937;
            padding-top: 10px;
        }
        .reply-bar input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .reply-bar button {
            background: #fbbf24;
            color: #111827;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>Admin Control Panel</span>
        <span style="font-size: 12px; color: #10b981;"><i class="fas fa-circle" style="font-size: 8px;"></i> Online</span>
    </div>

    <div class="container">
        <!-- Navigation Tabs -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchAdminTab('chatTab', this)">Live Support Chats</button>
            <button class="tab-btn" onclick="switchAdminTab('ordersTab', this)">Orders / History</button>
        </div>

        <!-- TAB 1: LIVE CHATS WITH MEDIA SUPPORT -->
        <div id="chatTab" class="tab-content active">
            <div class="chat-box-admin">
                <div class="messages-list" id="adminMessagesList">
                    <!-- Dynamic Messages will load here -->
                </div>
                <div class="reply-bar">
                    <input type="text" id="adminReplyInput" placeholder="Type reply as admin..." onkeypress="if(event.key === 'Enter') sendAdminReply()">
                    <button onclick="sendAdminReply()">Send</button>
                </div>
            </div>
        </div>

        <!-- TAB 2: ORDERS SECTION -->
        <div id="ordersTab" class="tab-content">
            <div style="background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; text-align: center; color: #94a3b8;">
                <p>Recharge & Withdrawal orders management dashboard.</p>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadAdminChats();
        };

        function switchAdminTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function loadAdminChats() {
            const listContainer = document.getElementById('adminMessagesList');
            let messages = JSON.parse(localStorage.getItem('titan_support_chats')) || [];
            
            listContainer.innerHTML = '';
            if(messages.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">No messages from users yet.</div>';
                return;
            }

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `admin-msg ${msg.sender}`;

                if (msg.type === 'text') {
                    div.innerHTML = `${msg.content} <div style="font-size:9px; opacity:0.7; text-align:right; margin-top:2px;">${msg.time}</div>`;
                } else if (msg.type === 'image') {
                    div.innerHTML = `<img src="${msg.content}" alt="User Photo"><div style="font-size:9px; opacity:0.7; text-align:right; margin-top:2px;">${msg.time}</div>`;
                } else if (msg.type === 'video') {
                    div.innerHTML = `<video controls src="${msg.content}"></video><div style="font-size:9px; opacity:0.7; text-align:right; margin-top:2px;">${msg.time}</div>`;
                } else if (msg.type === 'pdf' || msg.type === 'file') {
                    div.innerHTML = `<a href="${msg.content}" target="_blank" class="file-link"><i class="fas fa-file-pdf" style="color:#ef4444; font-size:16px;"></i> <span>${msg.fileName || 'View Document'}</span></a><div style="font-size:9px; opacity:0.7; text-align:right; margin-top:2px;">${msg.time}</div>`;
                }

                listContainer.appendChild(div);
            });
            listContainer.scrollTop = listContainer.scrollHeight;
        }

        function sendAdminReply() {
            const input = document.getElementById('adminReplyInput');
            const text = input.value.trim();
            if (!text) return;

            const replyObj = {
                sender: 'admin',
                type: 'text',
                content: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let messages = JSON.parse(localStorage.getItem('titan_support_chats')) || [];
            messages.push(replyObj);
            localStorage.setItem('titan_support_chats', JSON.stringify(messages));

            input.value = '';
            loadAdminChats();
        }
    </script>
</body>
</html>
