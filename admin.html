<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 25px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        .login-box button {
            width: 100%;
            background: #fbbf24;
            color: #111827;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .admin-tabs {
            display: flex;
            background: #111827;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1f2937;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background: #fbbf24;
            color: #111827;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .chat-layout {
            display: flex;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            height: 450px;
            overflow: hidden;
        }
        .user-list-pane {
            width: 40%;
            border-right: 1px solid #1f2937;
            overflow-y: auto;
            background: #0d1322;
        }
        .user-list-item {
            padding: 12px 15px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }
        .user-list-item:hover, .user-list-item.active {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }
        .chat-pane {
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }
        .messages-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        .admin-msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .admin-msg.user {
            background: #1f2937;
            color: #fff;
            align-self: flex-start;
            border: 1px solid #374151;
        }
        .admin-msg.admin {
            background: #fbbf24;
            color: #111827;
            align-self: flex-end;
        }
        .admin-msg img, .admin-msg video {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
        }
        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            margin-top: 5px;
        }
        .reply-bar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            border-top: 1px solid #1f2937;
            padding-top: 8px;
        }
        .reply-bar input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 8px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .reply-bar button {
            background: #fbbf24;
            color: #111827;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .sub-tab-btn {
            flex: 1;
            padding: 8px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }
        .sub-tab-btn.active {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-color: #fbbf24;
        }
        .order-card-admin {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        .order-row span {
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- PASSWORD LOGIN OVERLAY -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="color: #fbbf24; font-size: 16px;"><i class="fas fa-lock"></i> Admin Login</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Enter password to access dashboard</p>
            <input type="password" id="adminPasswordInput" placeholder="Enter password" onkeypress="if(event.key === 'Enter') verifyAdminLogin()">
            <button onclick="verifyAdminLogin()">Login</button>
        </div>
    </div>

    <div class="header">
        <span>Admin Control Panel</span>
        <span style="font-size: 12px; color: #10b981;"><i class="fas fa-circle" style="font-size: 8px;"></i> Online</span>
    </div>

    <div class="container">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchAdminTab('chatTab', this)">Live Support Chats</button>
            <button class="tab-btn" onclick="switchAdminTab('ordersTab', this)">Orders / History</button>
        </div>

        <div id="chatTab" class="tab-content active">
            <div class="chat-layout">
                <div class="user-list-pane" id="userListPane"></div>
                <div class="chat-pane" id="chatPane">
                    <div style="text-align:center; color:#94a3b8; margin-top:150px; font-size:12px;">Select a user to view chat</div>
                </div>
            </div>
        </div>

        <div id="ordersTab" class="tab-content">
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchSubTab('rechargeOrders', this)">Recharge Orders</button>
                <button class="sub-tab-btn" onclick="switchSubTab('withdrawOrders', this)">Withdrawal Orders</button>
            </div>

            <div id="rechargeOrders" class="sub-order-section">
                <div class="order-card-admin">
                    <div class="order-row">User: <span>User_7359</span></div>
                    <div class="order-row">Amount: <span style="color: #10b981;">₹500.00</span></div>
                    <div class="order-row">UTR: <span>UTR9876543210</span></div>
                    <div class="order-row">Status: <span style="color: #10b981;">SUCCESS</span></div>
                </div>
            </div>

            <div id="withdrawOrders" class="sub-order-section" style="display:none;">
                <div class="order-card-admin">
                    <div class="order-row">User: <span>User_7359</span></div>
                    <div class="order-row">Amount: <span style="color: #fbbf24;">₹150.00</span></div>
                    <div class="order-row">Type: <span>BANK CARD</span></div>
                    <div class="order-row">Status: <span style="color: #10b981;">Completed</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeUserId = null;

        function verifyAdminLogin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === 'CHUTIYABANA') {
                document.getElementById('loginOverlay').style.display = 'none';
                loadUserList();
            } else {
                alert('Wrong Password! Access Denied.');
                document.getElementById('adminPasswordInput').value = '';
            }
        }

        function switchAdminTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function switchSubTab(subId, btn) {
            document.querySelectorAll('.sub-order-section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.sub-tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(subId).style.display = 'block';
            btn.classList.add('active');
        }

        function loadUserList() {
            const userListPane = document.getElementById('userListPane');
            let chatsData = JSON.parse(localStorage.getItem('titan_support_chats_map')) || { 
                "User_7359": [{sender:'user', type:'text', content:'Hello admin, please check my recharge.', time:'14:30'}] 
            };
            
            userListPane.innerHTML = '';
            const users = Object.keys(chatsData);

            if(users.length === 0) {
                userListPane.innerHTML = '<div style="padding:15px; font-size:12px; color:#94a3b8;">No users found.</div>';
                return;
            }

            users.forEach(userId => {
                const div = document.createElement('div');
                div.className = `user-list-item ${activeUserId === userId ? 'active' : ''}`;
                div.innerHTML = `<i class="fas fa-user-circle"></i> ${userId}`;
                div.onclick = () => selectUserChat(userId);
                userListPane.appendChild(div);
            });

            if(!activeUserId && users.length > 0) {
                selectUserChat(users[0]);
            }
        }

        function selectUserChat(userId) {
            activeUserId = userId;
            loadUserList();

            const chatPane = document.getElementById('chatPane');
            let chatsData = JSON.parse(localStorage.getItem('titan_support_chats_map')) || {};
            let userMessages = chatsData[userId] || [];

            let html = `
                <div style="font-size:12px; font-weight:bold; color:#fbbf24; border-bottom:1px solid #1f2937; padding-bottom:8px; margin-bottom:8px;">
                    Chat with ${userId}
                </div>
                <div class="messages-list" id="activeMessagesList">
            `;

            if(userMessages.length === 0) {
                html += `<div style="text-align:center; color:#94a3b8; font-size:11px; margin-top:50px;">No messages in this chat.</div>`;
            } else {
                userMessages.forEach(msg => {
                    if (msg.type === 'text') {
                        html += `<div class="admin-msg ${msg.sender}">${msg.content} <div style="font-size:8px; opacity:0.7; text-align:right;">${msg.time}</div></div>`;
                    } else if (msg.type === 'image') {
                        html += `<div class="admin-msg ${msg.sender}"><img src="${msg.content}"><div style="font-size:8px; opacity:0.7; text-align:right;">${msg.time}</div></div>`;
                    } else if (msg.type === 'pdf' || msg.type === 'file') {
                        html += `<div class="admin-msg ${msg.sender}"><a href="${msg.content}" target="_blank" class="file-link"><i class="fas fa-file-pdf" style="color:#ef4444;"></i> <span>${msg.fileName || 'View File'}</span></a><div style="font-size:8px; opacity:0.7; text-align:right;">${msg.time}</div></div>`;
                    }
                });
            }

            html += `
                </div>
                <div class="reply-bar">
                    <input type="text" id="adminReplyInput" placeholder="Reply to ${userId}..." onkeypress="if(event.key === 'Enter') sendAdminReply()">
                    <button onclick="sendAdminReply()">Send</button>
                </div>
            `;

            chatPane.innerHTML = html;
            const msgList = document.getElementById('activeMessagesList');
            if(msgList) msgList.scrollTop = msgList.scrollHeight;
        }

        function sendAdminReply() {
            const input = document.getElementById('adminReplyInput');
            const text = input.value.trim();
            if (!text || !activeUserId) return;

            const replyObj = {
                sender: 'admin',
                type: 'text',
                content: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let chatsData = JSON.parse(localStorage.getItem('titan_support_chats_map')) || {};
            if(!chatsData[activeUserId]) chatsData[activeUserId] = [];
            chatsData[activeUserId].push(replyObj);
            
            localStorage.setItem('titan_support_chats_map', JSON.stringify(chatsData));
            selectUserChat(activeUserId);
        }
    </script>
</body>
</html>
