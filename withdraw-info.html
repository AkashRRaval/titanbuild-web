<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Withdrawal Information</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 70px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header i {
            cursor: pointer;
            font-size: 18px;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .tab-box {
            background: #0b0f19;
            border: 1px solid #fbbf24;
            color: #fbbf24;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input:disabled {
            background: #1f2937;
            color: #9ca3af;
            cursor: not-allowed;
        }
        .captcha-row {
            display: flex;
            gap: 10px;
        }
        .captcha-row input {
            flex: 1;
        }
        .captcha-img {
            background: #fff;
            color: #000;
            padding: 0 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 3px;
        }
        .btn-confirm {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .success-msg {
            background: #064e3b;
            color: #34d399;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
        <span>Withdrawal information</span>
        <i class="fas fa-university"></i>
    </div>

    <div class="container">
        <div class="card">
            <div class="tab-box">Bank Account Binding</div>
            <div id="successAlert" class="success-msg">Bank account successfully bound! Ready for withdrawals.</div>
            
            <div class="input-group">
                <label>Bank Account Number</label>
                <input type="text" id="accNo" placeholder="Enter bank account number">
            </div>
            <div class="input-group">
                <label>Account Holder Name</label>
                <input type="text" id="accName" placeholder="Please enter account holder name">
            </div>
            <div class="input-group">
                <label>Withdrawal Method</label>
                <input type="text" id="method" value="Bank Transfer" readonly>
            </div>
            <div class="input-group">
                <label>IFSC Code / Branch</label>
                <input type="text" id="ifsc" placeholder="Please enter IFSC code">
            </div>
            <div class="input-group" id="captchaBox">
                <label>Captcha Code</label>
                <div class="captcha-row">
                    <input type="text" id="captcha" placeholder="Enter captcha code">
                    <div class="captcha-img" id="captchaText">4829</div>
                </div>
            </div>
            <button class="btn-confirm" id="submitBtn" onclick="saveBank()">Confirm & Bind</button>
        </div>
    </div>

    <script>
        // Check if bank details are already saved (Prevents re-binding every time)
        window.onload = function() {
            const savedBank = localStorage.getItem('titan_bank_details');
            if (savedBank) {
                const data = JSON.parse(savedBank);
                document.getElementById('accNo').value = data.accNo;
                document.getElementById('accName').value = data.accName;
                document.getElementById('ifsc').value = data.ifsc;
                
                // Lock fields so user cannot edit once bound
                document.getElementById('accNo').disabled = true;
                document.getElementById('accName').disabled = true;
                document.getElementById('ifsc').disabled = true;
                document.getElementById('captchaBox').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'none';
                
                const alertBox = document.getElementById('successAlert');
                alertBox.style.display = 'block';
            }
        };

        function saveBank() {
            const acc = document.getElementById('accNo').value.trim();
            const name = document.getElementById('accName').value.trim();
            const ifsc = document.getElementById('ifsc').value.trim();
            const captcha = document.getElementById('captcha').value.trim();
            const correctCaptcha = document.getElementById('captchaText').innerText;

            if(!acc || !name || !ifsc || !captcha) {
                alert("Please fill in all the required details!");
                return;
            }
            if(captcha !== correctCaptcha) {
                alert("Invalid captcha code! Please try again.");
                return;
            }

            // Save securely to local storage (or integrate your backend API call here)
            const bankData = { accNo: acc, accName: name, ifsc: ifsc };
            localStorage.setItem('titan_bank_details', JSON.stringify(bankData));

            alert("Bank details bound successfully! You can now withdraw funds.");
            location.reload();
        }
    </script>
</body>
                                       </html>
