<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Bank Bind</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header a {
            color: #fbbf24;
            text-decoration: none;
            font-size: 16px;
        }
        .form-container {
            padding: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #111827;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #fbbf24;
        }
        .btn-submit {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .note {
            font-size: 12px;
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="profile.html"><i class="fas fa-arrow-left"></i></a>
        <span>Withdrawal Information</span>
        <div style="width: 20px;"></div>
    </div>

    <div class="form-container">
        <div class="input-group">
            <label>Account Holder Name</label>
            <input type="text" id="accName" placeholder="Enter bank account holder name">
        </div>
        <div class="input-group">
            <label>Bank Account Number</label>
            <input type="text" id="accNum" placeholder="Enter account number">
        </div>
        <div class="input-group">
            <label>IFSC Code</label>
            <input type="text" id="ifscCode" placeholder="Enter bank IFSC code">
        </div>
        
        <button class="btn-submit" id="bindBtn" onclick="saveBankDetails()">Bind Bank Account</button>
        <p class="note">* Note: Bank details can only be bound ONCE for security reasons.</p>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('bank_bound') === 'true') {
                document.getElementById('accName').value = localStorage.getItem('bank_name') || '';
                document.getElementById('accNum').value = localStorage.getItem('bank_num') || '';
                document.getElementById('ifscCode').value = localStorage.getItem('bank_ifsc') || '';
                
                // Disable inputs & button after one-time bind
                document.getElementById('accName').disabled = true;
                document.getElementById('accNum').disabled = true;
                document.getElementById('ifscCode').disabled = true;
                document.getElementById('bindBtn').style.display = 'none';
            }
        };

        function saveBankDetails() {
            const name = document.getElementById('accName').value.trim();
            const num = document.getElementById('accNum').value.trim();
            const ifsc = document.getElementById('ifscCode').value.trim();

            if(!name || !num || !ifsc) {
                alert("Please fill all bank details!");
                return;
            }

            localStorage.setItem('bank_bound', 'true');
            localStorage.setItem('bank_name', name);
            localStorage.setItem('bank_num', num);
            localStorage.setItem('bank_ifsc', ifsc);

            alert("Bank account successfully bound!");
            location.reload();
        }
    </script>
</body>
</html>
