<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - My Team</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 90px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .container {
            padding: 15px;
        }
        .invite-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .invite-title {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .invite-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .link-box {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #fbbf24;
            word-break: break-all;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-copy {
            background: #fbbf24;
            color: #111827;
        }
        .btn-copy:hover {
            background: #f59e0b;
        }
        .btn-whatsapp {
            background: #25d366;
            color: #fff;
        }
        .btn-whatsapp:hover {
            background: #20ba5a;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #34d399;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
        }
        .nav-item i {
            font-size: 18px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">My Team & Referral</div>

    <div class="container">
        <!-- Invite Card -->
        <div class="invite-card">
            <div class="invite-title">Invite Friends & Earn</div>
            <div class="invite-desc">Apna referral link share karein aur doston ki investment par commission paayein!</div>
            
            <div class="link-box" id="refLink">https://titanbuild-web.vercel.app/register.html?ref=12345</div>

            <div class="btn-group">
                <button class="btn-action btn-copy" onclick="copyRefLink()">
                    <i class="fas fa-copy"></i> Copy Link
                </button>
                <button class="btn-action btn-whatsapp" onclick="shareOnWhatsApp()">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </button>
            </div>
        </div>

        <!-- Team Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalTeam">0</div>
                <div class="stat-label">Total Team</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeTeam">0</div>
                <div class="stat-label">Active Members</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">₹<span id="teamCommission">0</span></div>
                <div class="stat-label">Total Commission</div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="invest.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Invest</span>
        </a>
        <a href="team.html" class="nav-item active">
            <i class="fas fa-users"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        window.onload = function() {
            // Get user phone or ID from localStorage to make unique referral link
            let userPhone = localStorage.getItem('userPhone') || '1234567890';
            let refUrl = window.location.origin + "/register.html?ref=" + userPhone;
            document.getElementById('refLink').innerText = refUrl;

            // Load Team stats from localStorage if available
            let teamData = JSON.parse(localStorage.getItem('teamData')) || { total: 0, active: 0, commission: 0 };
            document.getElementById('totalTeam').innerText = teamData.total;
            document.getElementById('activeTeam').innerText = teamData.active;
            document.getElementById('teamCommission').innerText = teamData.commission;
        };

        function copyRefLink() {
            let refText = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(refText).then(function() {
                alert("Referral link copied successfully!");
            }, function(err) {
                alert("Failed to copy link.");
            });
        }

        function shareOnWhatsApp() {
            let refText = document.getElementById('refLink').innerText;
            let message = "Join TitanBuild heavy machinery investment platform and earn daily profit! Use my link: " + refText;
            let whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
