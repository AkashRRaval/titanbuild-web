<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Team Commission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white pb-24 font-sans">

    <!-- Header -->
    <header class="bg-yellow-500 text-black font-extrabold p-4 sticky top-0 z-50 shadow-lg text-center text-lg">
        My Referral Team
    </header>

    <div class="p-4">
        <!-- Commission Summary Card -->
        <div class="bg-gray-800 rounded-2xl p-5 border border-yellow-500/30 text-center shadow-xl mb-5">
            <span class="text-xs text-gray-400 block mb-1">Total Team Bonus Earned</span>
            <span class="text-3xl font-black text-yellow-400">₹ 0.00</span>
            <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-700 text-xs">
                <div>
                    <span class="text-gray-400 block">Total Invited</span>
                    <span class="font-bold text-white text-base">0 Users</span>
                </div>
                <div>
                    <span class="text-gray-400 block">Active Assets</span>
                    <span class="font-bold text-green-400 text-base">0 Fleet</span>
                </div>
            </div>
        </div>

        <!-- Level Income Ratio -->
        <h3 class="text-sm font-bold border-l-4 border-yellow-500 pl-2 mb-3">Referral Levels</h3>
        <div class="space-y-3 mb-5">
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 flex justify-between items-center text-xs">
                <div>
                    <span class="font-bold text-yellow-400 block">Level 1 (Direct Member)</span>
                    <span class="text-gray-400">Commission Rate</span>
                </div>
                <span class="text-base font-black text-green-400">10%</span>
            </div>
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 flex justify-between items-center text-xs">
                <div>
                    <span class="font-bold text-yellow-400 block">Level 2 (Secondary Member)</span>
                    <span class="text-gray-400">Commission Rate</span>
                </div>
                <span class="text-base font-black text-green-400">3%</span>
            </div>
            <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 flex justify-between items-center text-xs">
                <div>
                    <span class="font-bold text-yellow-400 block">Level 3 (Sub-Member)</span>
                    <span class="text-gray-400">Commission Rate</span>
                </div>
                <span class="text-base font-black text-green-400">1%</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-950 border-t border-gray-800 flex justify-around p-3 text-center text-xs z-50">
        <a href="index.html" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-house text-lg mb-0.5"></i>
            <span>Home</span>
        </a>
        <a href="index.html#productsSection" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-truck-monster text-lg mb-0.5"></i>
            <span>Products</span>
        </a>
        <a href="team.html" class="text-yellow-400 font-bold flex flex-col items-center">
            <i class="fa-solid fa-users text-lg mb-0.5"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-user text-lg mb-0.5"></i>
            <span>My</span>
        </a>
    </nav>

</body>
</html>
