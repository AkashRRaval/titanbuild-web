<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Team</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 80px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .team-card {
            background: #111827;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            text-align: center;
        }
        .team-card h3 {
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .team-card p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .ref-box {
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            word-break: break-all;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
        }
        .nav-item i {
            font-size: 18px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">My Team</div>

    <div class="team-card">
        <h3>Invite Friends & Earn</h3>
        <p>Apna referral link share karein aur commission paayein.</p>
        <div class="ref-box" id="refLink">https://titanbuild.com/register.html?ref=12345</div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="invest.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Invest</span>
        </a>
        <a href="team.html" class="nav-item active">
            <i class="fas fa-users"></i>
            <span>Team</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

</body>
</html>
