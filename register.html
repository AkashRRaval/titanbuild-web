<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-container {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .register-container h2 {
            color: #fbbf24;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #fbbf24;
        }
        .btn-submit {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #f59e0b;
        }
        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .footer-text a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Create Account</h2>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="regPhone" placeholder="Enter your phone number">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPass" placeholder="Create a password">
        </div>
        <div class="input-group">
            <label>Referral Code (Optional)</label>
            <input type="text" id="refCode" placeholder="Enter invitation code">
        </div>

        <button class="btn-submit" onclick="handleRegister()">Register</button>

        <div class="footer-text">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        function handleRegister() {
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if(!phone || !pass) {
                alert("Please fill phone number and password!");
                return;
            }

            localStorage.setItem('registered_phone', phone);
            localStorage.setItem('registered_pass', pass);
            alert("Registration successful! Please login.");
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
