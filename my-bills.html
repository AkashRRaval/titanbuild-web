<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - My Bills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header a {
            color: #fbbf24;
            text-decoration: none;
            font-size: 16px;
        }
        .container {
            padding: 15px;
        }
        .bill-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bill-info h4 {
            color: #fff;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .bill-info p {
            color: #94a3b8;
            font-size: 11px;
        }
        .bill-amount {
            font-size: 15px;
            font-weight: bold;
            color: #10b981;
        }
        .bill-amount.expense {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="profile.html"><i class="fas fa-arrow-left"></i></a>
        <span>Transaction Records</span>
        <div style="width: 20px;"></div>
    </div>

    <div class="container">
        <div class="bill-card">
            <div class="bill-info">
                <h4>Daily Income Return</h4>
                <p>2026-06-07 10:30 AM</p>
            </div>
            <div class="bill-amount">+₹120.00</div>
        </div>

        <div class="bill-card">
            <div class="bill-info">
                <h4>Investment Purchase</h4>
                <p>2026-06-06 02:15 PM</p>
            </div>
            <div class="bill-amount expense">-₹500.00</div>
        </div>
    </div>

</body>
</html>
