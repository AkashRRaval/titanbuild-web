<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Withdraw Funds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userPhone = localStorage.getItem('userPhone');
        let userCurrentBalance = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            if (!userPhone) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('displayPhone').innerText = userPhone;

            try {
                const userRef = doc(db, "users", userPhone);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    userCurrentBalance = userSnap.data().balance || 0;
                    document.getElementById('availableBalance').innerText = '₹' + userCurrentBalance.toFixed(2);
                }
            } catch (e) {
                console.error("Error fetching balance:", e);
            }
        });

        window.submitWithdrawal = async function() {
            const amountInput = document.getElementById('withdrawAmount').value;
            const upiId = document.getElementById('upiId').value.trim();
            const amount = parseFloat(amountInput);

            if (!amount || amount <= 0) {
                alert('Please enter a valid withdrawal amount.');
                return;
            }

            if (amount < 200) {
                alert('Minimum withdrawal amount is ₹200.');
                return;
            }

            if (amount > userCurrentBalance) {
                alert('Insufficient wallet balance for this withdrawal.');
                return;
            }

            if (!upiId || !upiId.includes('@')) {
                alert('Please enter a valid UPI ID (e.g., paytm@upi or number@ybl).');
                return;
            }

            try {
                const orderNo = 'TB-WIT-' + Math.floor(100000 + Math.random() * 900000);
                const userRef = doc(db, "users", userPhone);

                // Deduct balance from user wallet
                await updateDoc(userRef, {
                    balance: increment(-amount)
                });

                // Save Withdrawal History
                await addDoc(collection(db, "withdrawals"), {
                    phone: userPhone,
                    orderNo: orderNo,
                    amount: amount,
                    upiId: upiId,
                    status: "Pending",
                    createdAt: serverTimestamp()
                });

                alert('Withdrawal request of ₹' + amount + ' submitted successfully! Order ID: ' + orderNo);
                window.location.href = 'index.html';

            } catch (e) {
                console.error("Withdrawal error:", e);
                alert('Withdrawal failed. Please try again.');
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24 font-sans">

    <!-- Top Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-yellow-600 to-amber-400 rounded-xl flex items-center justify-center text-black font-black shadow-lg">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>
            <h1 class="text-base font-black tracking-wider text-yellow-400 uppercase">WITHDRAW FUNDS</h1>
        </div>
        <div class="text-right">
            <span id="displayPhone" class="text-[10px] text-gray-400 block font-bold">Loading...</span>
        </div>
    </div>
        <div class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- Balance Overview Card -->
        <div class="bg-gradient-to-br from-gray-900 to-gray-900 p-5 rounded-3xl border border-yellow-500/30 shadow-2xl space-y-2">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Withdrawable Balance</p>
            <h2 id="availableBalance" class="text-2xl font-black text-yellow-400">₹0.00</h2>
            <p class="text-[10px] text-gray-500 font-medium">Minimum withdrawal limit: <strong class="text-white">₹200</strong></p>
        </div>

        <!-- Withdrawal Form -->
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-3xl shadow-xl space-y-4">
            <h3 class="text-xs font-black text-yellow-400 uppercase tracking-widest"><i class="fa-solid fa-building-columns mr-1"></i> Bank / UPI Payout Details</h3>

            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Withdrawal Amount (₹)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-yellow-400 font-bold text-sm">₹</span>
                        <input type="number" id="withdrawAmount" placeholder="Enter amount to withdraw" class="w-full bg-gray-950 border border-gray-800 rounded-2xl py-3 pl-9 pr-4 text-sm text-white focus:outline-none focus:border-yellow-500 font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Receiver UPI ID / VPA</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-gray-500 text-sm"><i class="fa-solid fa-at"></i></span>
                        <input type="text" id="upiId" placeholder="e.g. mobile@paytm or UPI ID" class="w-full bg-gray-950 border border-gray-800 rounded-2xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-yellow-500 font-bold">
                    </div>
                </div>
            </div>

            <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800/80 text-[11px] text-gray-400 space-y-1">
                <p><i class="fa-solid fa-circle-info text-yellow-400 mr-1"></i> Payouts are usually processed within 24 hours.</p>
                <p><i class="fa-solid fa-shield-halved text-yellow-400 mr-1"></i> Ensure your UPI ID is correct to prevent transaction failure.</p>
            </div>

            <button onclick="submitWithdrawal()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-600 hover:to-amber-600 text-black font-black py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg mt-2">
                SUBMIT WITHDRAWAL REQUEST
            </button>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto shadow-2xl">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-gray-400 hover:text-gray-200 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
</html>
