<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC89zMGIcD6Gi-KuNzP7xlRsqfj0gtXhDo",
            authDomain: "titanbuild-1509e.firebaseapp.com",
            projectId: "safargo-55e25",
            storageBucket: "titanbuild-1509e.firebasestorage.app",
            messagingSenderId: "740130026137",
            appId: "1:740130026137:web:ca74a4ca8c72b537efbe08",
            measurementId: "G-70T3E080HM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const loginTime = localStorage.getItem('loginTime');
        const userPhone = localStorage.getItem('userPhone');

        if (!isLoggedIn || !loginTime || (Date.now() - parseInt(loginTime)) > 30 * 60 * 1000) {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loginTime');
            localStorage.removeItem('userPhone');
            window.location.href = "login.html";
        }

        // Fetch user live balance on load
        window.addEventListener('DOMContentLoaded', async () => {
            if (userPhone) {
                try {
                    const userRef = doc(db, "users", userPhone);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        document.getElementById('userBalance').innerText = '₹' + (data.balance || 0);
                    }
                } catch (e) {
                    console.error("Error fetching balance:", e);
                }
            }
        });

        window.submitWithdrawal = async function() {
            const amount = Number(document.getElementById('withdrawAmount').value);
            const upiId = document.getElementById('withdrawUpi').value.trim();

            if (!amount || amount < 200) {
                alert('Minimum withdrawal amount is ₹200!');
                return;
            }

            if (!upiId) {
                alert('Please enter your UPI ID or Bank details!');
                return;
            }

            try {
                const userRef = doc(db, "users", userPhone);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    alert('User not found!');
                    return;
                }

                const userData = userSnap.data();
                const currentBalance = userData.balance || 0;

                if (currentBalance < amount) {
                    alert('Insufficient balance in your account!');
                    return;
                }

                // Deduct balance and save withdrawal request
                const newBalance = currentBalance - amount;
                await setDoc(userRef, { balance: newBalance }, { merge: true });

                const withdrawId = 'WD_' + Date.now();
                const withdrawRef = doc(db, "withdrawals", withdrawId);
                await setDoc(withdrawRef, {
                    phone: userPhone,
                    amount: amount,
                    upiId: upiId,
                    status: 'Pending',
                    timestamp: new Date().toISOString()
                });

                alert(`Withdrawal request of ₹${amount} submitted successfully!`);
                window.location.href = "profile.html";
            } catch (error) {
                console.error("Withdrawal error:", error);
                alert('Withdrawal failed. Please check your internet connection.');
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-10 font-sans">

    <!-- Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between sticky top-0 z-50">
        <a href="profile.html" class="text-yellow-400 text-xl font-bold">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-lg font-black tracking-wider text-yellow-400 uppercase">Withdraw Money</h1>
        <div class="w-5"></div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-5">
        <!-- Balance Card -->
        <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-xl flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-400 font-bold uppercase">Available Balance</p>
                <h2 id="userBalance" class="text-2xl font-black text-yellow-400">₹0</h2>
            </div>
            <div class="bg-yellow-500/10 p-3 rounded-xl border border-yellow-500/30 text-yellow-400">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
        </div>

        <!-- Withdrawal Form -->
        <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-xl space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Enter Amount to Withdraw</label>
                <input type="number" id="withdrawAmount" placeholder="Min ₹200" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-yellow-400 font-bold focus:outline-none focus:border-yellow-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Enter UPI ID / Bank Details</label>
                <input type="text" id="withdrawUpi" placeholder="e.g. yourname@paytm" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
            </div>

            <button onclick="submitWithdrawal()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3.5 rounded-xl text-sm shadow-lg transition uppercase tracking-wide">
                Submit Withdrawal
            </button>
        </div>
    </div>

</body>
</html>
