<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Withdrawal Information</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 70px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header i {
            cursor: pointer;
            font-size: 18px;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .tab-box {
            background: #0b0f19;
            border: 1px solid #fbbf24;
            color: #fbbf24;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .captcha-row {
            display: flex;
            gap: 10px;
        }
        .captcha-row input {
            flex: 1;
        }
        .captcha-img {
            background: #fff;
            color: #000;
            padding: 0 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 3px;
        }
        .btn-confirm {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
        <span>Withdrawal information</span>
        <i class="fas fa-university"></i>
    </div>

    <div class="container">
        <div class="card">
            <div class="tab-box">Bank</div>
            <div class="input-group">
                <input type="text" id="accNo" placeholder="Enter bank account number">
            </div>
            <div class="input-group">
                <input type="text" id="accName" placeholder="Please enter the account holder's name">
            </div>
            <div class="input-group">
                <input type="text" id="method" placeholder="Please select the withdrawal method" value="Bank Transfer" readonly>
            </div>
            <div class="input-group">
                <input type="text" id="ifsc" placeholder="Please enter the IFSC code / branch">
            </div>
            <div class="input-group captcha-row">
                <input type="text" id="captcha" placeholder="Please enter the captcha code">
                <div class="captcha-img">8887</div>
            </div>
            <button class="btn-confirm" onclick="saveBank()">Confirm</button>
        </div>
    </div>

    <script>
        function saveBank() {
            const acc = document.getElementById('accNo').value.trim();
            const name = document.getElementById('accName').value.trim();
            const captcha = document.getElementById('captcha').value.trim();

            if(!acc || !name || !captcha) {
                alert("Please fill in all the required details!");
                return;
            }
            if(captcha !== "8887") {
                alert("Invalid captcha code!");
                return;
            }
            alert("Bank details saved successfully!");
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
