<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Withdrawal History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 80px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header i {
            cursor: pointer;
            font-size: 18px;
        }
        .container {
            max-width: 480px;
            margin: 15px auto;
            padding: 0 15px;
        }
        /* Sample jaisa Dark Order Card */
        .order-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 8px;
        }
        .type-badge {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge {
            color: #10b981;
            font-size: 13px;
            font-weight: bold;
        }
        .order-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .order-info-row span {
            color: #fff;
            font-weight: 500;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1f2937;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item i {
            display: block;
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
        <span>Withdrawal History</span>
        <a href="cs.html" style="color: #fbbf24; font-size: 16px;"><i class="fas fa-headset"></i></a>
    </div>

    <div class="container" id="withdrawHistoryContainer">
        <!-- Sample Dark Cards matching user requirement -->
        <div class="order-card">
            <div class="order-card-header">
                <span class="type-badge">Withdraw</span>
                <span class="status-badge">Completed</span>
            </div>
            <div class="order-info-row">
                Balance: <span style="color: #fbbf24;">₹150</span>
            </div>
            <div class="order-info-row">
                Type: <span>BANK CARD</span>
            </div>
            <div class="order-info-row">
                Time: <span>2026-09-16 14:31:17</span>
            </div>
            <div class="order-info-row" style="font-size: 11px; margin-top: 6px; border-top: 1px solid #1f2937; padding-top: 6px;">
                Order number: <span style="font-size: 11px; color: #fbbf24;">W51202609161431164990001</span>
            </div>
        </div>

        <div class="order-card">
            <div class="order-card-header">
                <span class="type-badge">Withdraw</span>
                <span class="status-badge">Completed</span>
            </div>
            <div class="order-info-row">
                Balance: <span style="color: #fbbf24;">₹152</span>
            </div>
            <div class="order-info-row">
                Type: <span>BANK CARD</span>
            </div>
            <div class="order-info-row">
                Time: <span>2026-09-16 13:53:59</span>
            </div>
            <div class="order-info-row" style="font-size: 11px; margin-top: 6px; border-top: 1px solid #1f2937; padding-top: 6px;">
                Order number: <span style="font-size: 11px; color: #fbbf24;">W51202609161353589560001</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="recharge.html" class="nav-item">
            <i class="fas fa-wallet"></i> Recharge
        </a>
        <a href="withdraw.html" class="nav-item active">
            <i class="fas fa-exchange-alt"></i> Withdraw
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i> Profile
        </a>
    </div>

</body>
</html>
