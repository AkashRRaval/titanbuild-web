<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5TOY2RYSYrxvugtDF1F2x79GMAjyzPYw",
            authDomain: "safargo-55e25.firebaseapp.com",
            projectId: "safargo-55e25",
            storageBucket: "safargo-55e25.firebasestorage.app",
            messagingSenderId: "812165464390",
            appId: "1:812165464390:web:cfb18865e8af5f5b24a547"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const userPhone = localStorage.getItem('userPhone');

        if (!isLoggedIn) {
            window.location.href = "login.html";
        }

        let userCurrentBalance = 0;

        // Fetch current balance on load
        window.addEventListener('DOMContentLoaded', async () => {
            if (userPhone) {
                try {
                    const userRef = doc(db, "users", userPhone);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        userCurrentBalance = userSnap.data().balance || 0;
                        document.getElementById('availableBalance').innerText = '₹' + userCurrentBalance;
                    }
                } catch (e) {
                    console.error("Error fetching balance:", e);
                }
            }
        });

        window.submitWithdrawal = async function(event) {
            event.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const upiId = document.getElementById('upiId').value.trim();

            if (!amount || !upiId) {
                alert('Please enter amount and UPI ID!');
                return;
            }

            if (amount > userCurrentBalance) {
                alert('Insufficient balance!');
                return;
            }

            try {
                const withdrawId = 'WD_' + Date.now();
                // Create withdrawal request
                await setDoc(doc(db, "withdrawals", withdrawId), {
                    phone: userPhone,
                    amount: amount,
                    upiId: upiId,
                    status: 'Pending',
                    createdAt: new Date().toISOString()
                });

                // Deduct balance from user account
                const newBalance = userCurrentBalance - amount;
                await updateDoc(doc(db, "users", userPhone), {
                    balance: newBalance
                });

                alert('Withdrawal request submitted successfully!');
                window.location.href = 'profile.html';
            } catch (error) {
                console.error("Error submitting withdrawal: ", error);
                alert('Firebase Error: ' + error.message);
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 text-center sticky top-0 z-50">
        <h1 class="text-lg font-black tracking-wider text-yellow-400 uppercase">Withdraw Money</h1>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-5">
        <!-- Balance Card -->
        <div class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl space-y-1">
            <p class="text-xs text-gray-400 font-bold uppercase">Available Balance</p>
            <h2 id="availableBalance" class="text-2xl font-black text-yellow-400">₹0</h2>
        </div>

        <form onsubmit="submitWithdrawal(event)" class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Withdraw Amount (₹)</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">UPI ID / Bank Details</label>
                <input type="text" id="upiId" placeholder="e.g. username@okhdfcbank" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3.5 rounded-xl text-sm shadow-lg transition uppercase tracking-wide">
                Withdraw
            </button>
        </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
</html>
