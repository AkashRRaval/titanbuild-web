<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - My Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 20px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header a {
            color: #fbbf24;
            text-decoration: none;
            font-size: 16px;
        }
        .container {
            padding: 15px;
        }
        .my-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .my-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        .my-info h4 {
            color: #fff;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .my-info p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 3px;
        }
        .my-info span {
            color: #fbbf24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="profile.html"><i class="fas fa-arrow-left"></i></a>
        <span>My Products History</span>
        <div style="width: 20px;"></div>
    </div>

    <div class="container">
        <div class="my-card">
            <img src="qr1.png" alt="Product">
            <div class="my-info">
                <h4>Titan Standard Asset - I</h4>
                <p>Invested: <span>₹500</span></p>
                <p>Daily Return: <span>₹120</span></p>
                <p>Status: <span style="color: #10b981;">Active</span></p>
            </div>
        </div>
    </div>

</body>
</html>
