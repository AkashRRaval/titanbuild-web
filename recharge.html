<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Recharge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 70px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header i {
            cursor: pointer;
            font-size: 18px;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .card h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .qr-box {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .qr-box img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }
        .upi-text {
            color: #fbbf24;
            font-size: 14px;
            font-weight: 600;
            margin-top: 5px;
            word-break: break-all;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .btn-submit {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .channel-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .channel-btn {
            flex: 1;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .channel-btn.active {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
        <span>Recharge Funds</span>
        <i class="fas fa-wallet"></i>
    </div>

    <div class="container">
        <!-- Channel Selectors -->
        <div class="channel-selector">
            <div class="channel-btn active" onclick="switchChannel(1, this)">Channel 1 (Navi QR)</div>
            <div class="channel-btn" onclick="switchChannel(2, this)">Channel 2 (Navi QR)</div>
        </div>

        <!-- RECHARGE CARD 1 -->
        <div class="card" id="channel1Card">
            <h3>Scan & Pay via UPI App</h3>
            <div class="qr-box">
                <!-- Fallback to external direct github raw URL or embedded if available, using raw GitHub link to ensure load -->
                <img src="https://raw.githubusercontent.com/AkashRRaval/titanbuild/main/NaviQR_RAVAL_RAJUBHAI_MANGABHAI_18092026211409379.png" onerror="this.src='qr1.png'" alt="QR Code 1">
            </div>
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 5px;">UPI ID:</div>
            <div class="upi-text">ravalrajubhai331@naviaxis</div>
        </div>

        <!-- RECHARGE CARD 2 -->
        <div class="card" id="channel2Card" style="display: none;">
            <h3>Scan & Pay via UPI App</h3>
            <div class="qr-box">
                <img src="https://raw.githubusercontent.com/AkashRRaval/titanbuild/main/NaviQR_RANJANBEN_RAJUBHAI_18092026212538836.png" onerror="this.src='qr2.png'" alt="QR Code 2">
            </div>
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 5px;">UPI ID:</div>
            <div class="upi-text">fastpaytes@naviaxis</div>
        </div>

        <!-- UTR Submission Card -->
        <div class="card">
            <h3>Submit UTR / Reference Number</h3>
            <div class="input-group">
                <label>Recharge Amount (₹)</label>
                <input type="number" id="rechargeAmount" placeholder="Enter amount">
            </div>
            <div class="input-group">
                <label>12-Digit UTR / Ref Number</label>
                <input type="text" id="utrNumber" placeholder="Enter UTR number">
            </div>
            <button class="btn-submit" onclick="submitRecharge()">Submit Recharge</button>
        </div>
    </div>

    <script>
        function switchChannel(channelNo, btn) {
            document.querySelectorAll('.channel-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');

            if(channelNo === 1) {
                document.getElementById('channel1Card').style.display = 'block';
                document.getElementById('channel2Card').style.display = 'none';
            } else {
                document.getElementById('channel1Card').style.display = 'none';
                document.getElementById('channel2Card').style.display = 'block';
            }
        }

        function submitRecharge() {
            const amount = document.getElementById('rechargeAmount').value.trim();
            const utr = document.getElementById('utrNumber').value.trim();

            if(!amount || !utr) {
                alert("Please fill in both amount and UTR number!");
                return;
            }

            alert("Recharge request submitted successfully for verification!");
            document.getElementById('rechargeAmount').value = '';
            document.getElementById('utrNumber').value = '';
        }
    </script>
</body>
</html>
