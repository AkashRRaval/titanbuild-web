<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Recharge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 80px;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .container {
            max-width: 480px;
            margin: 15px auto;
            background: #111827;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }
        .telegram-box {
            background: #1e293b;
            border: 1px solid #229ed9;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .telegram-box p {
            font-size: 13px;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        .telegram-btn {
            display: inline-block;
            background: #229ed9;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fbbf24;
        }
        .channel-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .channel-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #94a3b8;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .channel-btn.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }
        .qr-section {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .qr-box {
            width: 150px;
            height: 150px;
            background: #fff;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .qr-box img {
            width: 140px;
            height: 140px;
        }
        .upi-id {
            font-size: 13px;
            color: #fbbf24;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-control:focus {
            border-color: #fbbf24;
        }
        .submit-btn {
            width: 100%;
            background: #fbbf24;
            color: #111827;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1f2937;
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
        }
        .nav-item i {
            display: block;
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="header">
        TitanBuild Recharge Portal
    </div>

    <div class="container">
        <!-- Telegram Channel Box -->
        <div class="telegram-box">
            <p><i class="fab fa-telegram-plane"></i> Join our official Telegram channel for updates</p>
            <a href="https://t.me/titanbuid" target="_blank" class="telegram-btn">
                Open Telegram
            </a>
        </div>

        <div class="section-title">Select Recharge Channel</div>
        <div class="channel-options">
            <div class="channel-btn active" onclick="selectChannel(1)">Channel 1 (Ranjanben)</div>
            <div class="channel-btn" onclick="selectChannel(2)">Channel 2 (Rajubhai)</div>
        </div>

        <!-- UPI QR Code Section -->
        <div class="qr-section">
            <div class="qr-box">
                <!-- Replace with your actual QR code image path -->
                <img src="qr-code.png" alt="UPI QR Code" id="qrImage">
            </div>
            <div class="upi-id" id="upiText">UPI ID: merchant@upi</div>
        </div>

        <div class="form-group">
            <label>Enter Recharge Amount (₹)</label>
            <input type="number" class="form-control" id="rechargeAmount" placeholder="e.g. 1000">
        </div>

        <div class="form-group">
            <label>Enter 12-Digit UTR / Reference Number</label>
            <input type="text" class="form-control" id="utrNumber" placeholder="Enter UTR after payment">
        </div>

        <button class="submit-btn" onclick="submitRecharge()">Submit Recharge</button>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="recharge.html" class="nav-item active">
            <i class="fas fa-wallet"></i> Recharge
        </a>
        <a href="withdraw.html" class="nav-item">
            <i class="fas fa-exchange-alt"></i> Withdraw
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i> Profile
        </a>
    </div>

    <script>
        function selectChannel(ch) {
            const btns = document.querySelectorAll('.channel-btn');
            btns.forEach(b => b.classList.remove('active'));
            btns[ch - 1].classList.add('active');
            
            // Channel change hone par QR ya UPI ID change karne ka logic yahan daal sakte hain
            if(ch === 1) {
                document.getElementById('upiText').innerText = "UPI ID: ranjanben@upi";
            } else {
                document.getElementById('upiText').innerText = "UPI ID: rajubhai@upi";
            }
        }

        function submitRecharge() {
            const amount = document.getElementById('rechargeAmount').value;
            const utr = document.getElementById('utrNumber').value;

            if(!amount || !utr) {
                alert('Please fill in both amount and UTR number!');
                return;
            }

            if(utr.length < 12) {
                alert('Please enter a valid 12-digit UTR number!');
                return;
            }

            alert('Recharge request submitted successfully!');
        }
    </script>
</body>
</html>
