<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Recharge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 40px;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 480px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1e293b;
        }
        .telegram-box {
            background: linear-gradient(135deg, #229ed9, #1b87bd);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(34, 158, 217, 0.3);
        }
        .telegram-box p {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .telegram-btn {
            display: inline-block;
            background: #fff;
            color: #229ed9;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .telegram-btn:hover {
            background: #f1f5f9;
        }
        .channel-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .channel-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }
        .channel-btn.active {
            border-color: #229ed9;
            background: #e0f2fe;
            color: #0369a1;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #229ed9;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
            transition: 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="header">
        TitanBuild Recharge Portal
    </div>

    <div class="container">
        <!-- Telegram Channel Promotion & Link Box -->
        <div class="telegram-box">
            <p><i class="fab fa-telegram-plane"></i> Join our official Telegram channel for daily withdrawal proofs & updates!</p>
            <a href="https://t.me/titanbuid" target="_blank" class="telegram-btn">
                Join Channel Now
            </a>
        </div>

        <div class="section-title">Select Recharge Channel</div>
        <div class="channel-options">
            <div class="channel-btn active" onclick="selectChannel(1)">Channel 1 (Ranjanben)</div>
            <div class="channel-btn" onclick="selectChannel(2)">Channel 2 (Rajubhai)</div>
        </div>

        <div class="form-group">
            <label>Enter Recharge Amount (₹)</label>
            <input type="number" class="form-control" id="rechargeAmount" placeholder="e.g. 1000">
        </div>

        <div class="form-group">
            <label>Enter 12-Digit UTR / Reference Number</label>
            <input type="text" class="form-control" id="utrNumber" placeholder="Enter UTR after payment">
        </div>

        <button class="submit-btn" onclick="submitRecharge()">Submit Recharge</button>
    </div>

    <script>
        function selectChannel(ch) {
            const btns = document.querySelectorAll('.channel-btn');
            btns.forEach(b => b.classList.remove('active'));
            btns[ch - 1].classList.add('active');
        }

        function submitRecharge() {
            const amount = document.getElementById('rechargeAmount').value;
            const utr = document.getElementById('utrNumber').value;

            if(!amount || !utr) {
                alert('Please fill in both amount and UTR number!');
                return;
            }

            if(utr.length < 12) {
                alert('Please enter a valid 12-digit UTR number!');
                return;
            }

            alert('Recharge request submitted successfully! Verification in progress.');
        }
    </script>
</body>
</html>
