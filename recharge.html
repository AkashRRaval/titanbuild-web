<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Wallet - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Top Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between">
        <a href="index.html" class="text-yellow-400 text-lg"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-base font-extrabold text-yellow-400 uppercase tracking-wider">Recharge Account</h1>
        <div class="w-5"></div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- Amount Selection -->
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 shadow-md">
            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">Select or Enter Amount (₹)</label>
            <input type="number" id="rechargeAmount" placeholder="Enter amount" value="1000" class="w-full bg-gray-950 border border-yellow-500/50 rounded-lg p-3 text-yellow-400 font-extrabold text-xl focus:outline-none focus:border-yellow-400">
            
            <div class="grid grid-cols-4 gap-2 mt-3">
                <button onclick="setAmount(500)" class="bg-gray-800 hover:bg-gray-700 text-xs font-bold py-2 rounded border border-gray-700 text-yellow-400">₹500</button>
                <button onclick="setAmount(1000)" class="bg-gray-800 hover:bg-gray-700 text-xs font-bold py-2 rounded border border-gray-700 text-yellow-400">₹1,000</button>
                <button onclick="setAmount(3000)" class="bg-gray-800 hover:bg-gray-700 text-xs font-bold py-2 rounded border border-gray-700 text-yellow-400">₹3,000</button>
                <button onclick="setAmount(5000)" class="bg-gray-800 hover:bg-gray-700 text-xs font-bold py-2 rounded border border-gray-700 text-yellow-400">₹5,000</button>
            </div>
        </div>

        <!-- Channel Selection -->
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 shadow-md">
            <label class="block text-xs font-bold text-gray-400 mb-3 uppercase">Select Payment Channel</label>
            <div class="grid grid-cols-2 gap-3">
                <button id="btnChan1" onclick="switchChannel(1)" class="p-3 bg-yellow-500 text-black font-extrabold rounded-lg text-xs flex flex-col items-center border-2 border-yellow-400 shadow">
                    <span>CHANNEL 1</span>
                    <span class="text-[10px] font-normal mt-0.5">Navi / Express UPI</span>
                </button>
                <button id="btnChan2" onclick="switchChannel(2)" class="p-3 bg-gray-800 text-gray-400 font-bold rounded-lg text-xs flex flex-col items-center border border-gray-700">
                    <span>CHANNEL 2</span>
                    <span class="text-[10px] font-normal mt-0.5">Fast Pay / GPay</span>
                </button>
            </div>
        </div>

        <!-- Payment Details & QR Display -->
        <div class="bg-gray-900 p-5 rounded-2xl border border-yellow-500/30 text-center space-y-4 shadow-xl">
            <span class="text-xs font-bold bg-yellow-500/10 text-yellow-400 px-3 py-1 rounded-full border border-yellow-500/30">Scan QR Code or Copy UPI ID</span>
            
            <div class="p-2 bg-white rounded-xl inline-block border-2 border-yellow-400 shadow-lg">
                <img id="qrDisplay" src="1000083341.png" alt="Payment QR Code" class="w-56 h-56 mx-auto object-contain">
            </div>

            <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 flex justify-between items-center text-xs">
                <div class="text-left">
                    <p class="text-gray-500 text-[10px]">UPI ID</p>
                    <p id="upiDisplay" class="font-bold text-yellow-400 text-sm">ravalrajubhai331@naviaxis</p>
                </div>
                <button onclick="copyUPI()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold px-3 py-1.5 rounded text-xs transition">Copy</button>
            </div>
        </div>

        <!-- UTR Submission Form -->
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
            <label class="block text-xs font-bold text-gray-400 uppercase">Enter 12-Digit UTR / Ref Number</label>
            <input type="text" id="utrNumber" maxlength="12" placeholder="e.g. 423456789012" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white font-mono text-sm focus:outline-none focus:border-yellow-400">
            
            <button onclick="submitRecharge()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-600 hover:to-amber-600 text-black font-extrabold py-3 rounded-xl shadow-lg transition text-sm">
                SUBMIT RECHARGE
            </button>
        </div>

    </div>

    <script>
        let currentChan = 1;
        const upi1 = "ravalrajubhai331@naviaxis";
        const upi2 = "fastpaytes@naviaxis";

        function setAmount(val) {
            document.getElementById('rechargeAmount').value = val;
        }

        function switchChannel(chan) {
            currentChan = chan;
            const btn1 = document.getElementById('btnChan1');
            const btn2 = document.getElementById('btnChan2');
            const qr = document.getElementById('qrDisplay');
            const upi = document.getElementById('upiDisplay');

            if (chan === 1) {
                btn1.className = "p-3 bg-yellow-500 text-black font-extrabold rounded-lg text-xs flex flex-col items-center border-2 border-yellow-400 shadow";
                btn2.className = "p-3 bg-gray-800 text-gray-400 font-bold rounded-lg text-xs flex flex-col items-center border border-gray-700";
                qr.src = "1000083341.png";
                upi.innerText = upi1;
            } else {
                btn2.className = "p-3 bg-yellow-500 text-black font-extrabold rounded-lg text-xs flex flex-col items-center border-2 border-yellow-400 shadow";
                btn1.className = "p-3 bg-gray-800 text-gray-400 font-bold rounded-lg text-xs flex flex-col items-center border border-gray-700";
                qr.src = "1000083342.png";
                upi.innerText = upi2;
            }
        }

        function copyUPI() {
            const upiText = document.getElementById('upiDisplay').innerText;
            navigator.clipboard.writeText(upiText);
            alert("UPI ID Copied: " + upiText);
        }

        function submitRecharge() {
            const amt = document.getElementById('rechargeAmount').value;
            const utr = document.getElementById('utrNumber').value;

            if (!amt || amt <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            if (utr.length < 12) {
                alert("Please enter valid 12-digit UTR/Reference Number.");
                return;
            }

            // Save pending recharge request
            let recharges = JSON.parse(localStorage.getItem('pendingRecharges') || '[]');
            recharges.push({
                amount: amt,
                utr: utr,
                channel: currentChan,
                status: 'Pending',
                date: new Date().toLocaleString()
            });
            localStorage.setItem('pendingRecharges', JSON.stringify(recharges));

            alert("Recharge Request Submitted Successfully! Status: Pending Approval.");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
