<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const userPhone = localStorage.getItem('userPhone');

        if (!isLoggedIn) {
            window.location.href = "login.html";
        }

        window.submitRecharge = async function(event) {
            event.preventDefault();
            const amount = document.getElementById('rechargeAmount').value.trim();
            const utr = document.getElementById('utrNumber').value.trim();

            if (!amount || !utr) {
                alert('Please enter amount and UTR number!');
                return;
            }

            try {
                const rechargeId = 'RECH_' + Date.now();
                await setDoc(doc(db, "recharges", rechargeId), {
                    phone: userPhone,
                    amount: parseFloat(amount),
                    utrNumber: utr,
                    status: 'Pending',
                    createdAt: new Date().toISOString()
                });

                alert('Recharge request submitted successfully! Pending verification.');
                document.getElementById('rechargeForm').reset();
            } catch (error) {
                console.error("Error submitting recharge: ", error);
                alert('Firebase Error: ' + error.message);
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 text-center sticky top-0 z-50">
        <h1 class="text-lg font-black tracking-wider text-yellow-400 uppercase">Recharge Account</h1>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">
        <form id="rechargeForm" onsubmit="submitRecharge(event)" class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Enter Amount (₹)</label>
                <input type="number" id="rechargeAmount" placeholder="e.g. 500" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">12-Digit UTR / Transaction ID</label>
                <input type="text" id="utrNumber" placeholder="Enter UTR number after payment" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3.5 rounded-xl text-sm shadow-lg transition uppercase tracking-wide">
                Submit UTR
            </button>
        </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
</html>
