<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Recharge Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            const userPhone = localStorage.getItem('userPhone');
            if (userPhone) {
                document.getElementById('displayUserPhone').innerText = userPhone;
                try {
                    const userRef = doc(db, "users", userPhone);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        document.getElementById('currentWalletBalance').innerText = '₹' + (data.balance || 0).toFixed(2);
                    }
                } catch (e) {
                    console.error("Error fetching balance:", e);
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        window.submitRecharge = async function() {
            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            const utr = document.getElementById('utrInput').value.trim();
            const userPhone = localStorage.getItem('userPhone');

            if (!amount || amount <= 0) {
                alert('Please enter a valid recharge amount.');
                return;
            }
            if (!utr || utr.length < 6) {
                alert('Please enter a valid 12-digit UTR / Transaction ID.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            try {
                const userRef = doc(db, "users", userPhone);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    await updateDoc(userRef, {
                        balance: increment(amount)
                    });
                } else {
                    await setDoc(userRef, {
                        phone: userPhone,
                        balance: amount,
                        lockedEarnings: 0
                    });
                }

                alert('Recharge of ₹' + amount + ' successfully added to your wallet!');
                window.location.href = 'index.html';

            } catch (error) {
                console.error("Recharge error: ", error);
                alert('Recharge failed. Please try again.');
                btn.innerText = "SUBMIT RECHARGE & UTR";
                btn.disabled = false;
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-24 font-sans">

    <!-- Top Header -->
    <div class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center max-w-md mx-auto">
        <a href="index.html" class="text-yellow-400 font-bold"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1 class="text-lg font-black tracking-wider text-yellow-400 uppercase">RECHARGE WALLET</h1>
        <div class="w-6"></div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- User & Balance Status -->
        <div class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl flex justify-between items-center">
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase">Logged In As</p>
                <h3 id="displayUserPhone" class="text-sm font-black text-white">Loading...</h3>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-400 font-bold uppercase">Current Wallet</p>
                <h3 id="currentWalletBalance" class="text-base font-black text-green-400">₹0.00</h3>
            </div>
        </div>

        <!-- Payment QR / UPI Box with Real QR -->
        <div class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl space-y-4 text-center">
            <h3 class="text-sm font-black text-yellow-400 uppercase"><i class="fa-solid fa-qrcode mr-1"></i> Scan & Pay via UPI</h3>
            <p class="text-xs text-gray-400">Scan this QR using any UPI app (GPay, PhonePe, Paytm, Navi)</p>
            
            <div class="bg-white p-3 rounded-2xl inline-block mx-auto shadow-inner border border-yellow-500/50">
                <!-- User's Real QR Image Display -->
                <img src="1000083341.png" alt="UPI QR Code" class="w-48 h-48 object-contain rounded-xl mx-auto">
            </div>

            <div class="bg-gray-950 p-3 rounded-2xl border border-gray-800 text-xs text-yellow-400 font-bold">
                UPI ID: <span class="text-white select-all">ravalrajubhai331@naviaxis</span>[span_1](start_span)[span_1](end_span)
            </div>
        </div>

        <!-- Recharge Submission Form -->
        <div class="bg-gray-900 p-5 rounded-3xl border border-gray-800 shadow-xl space-y-4">
            <div class="space-y-2">
                <label class="text-[11px] text-gray-400 font-bold block">Enter Recharge Amount (₹)</label>
                <input type="number" id="rechargeAmount" placeholder="e.g. 1000" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:border-yellow-500 outline-none">
            </div>

            <div class="space-y-2">
                <label class="text-[11px] text-gray-400 font-bold block">Enter 12-Digit UTR / Transaction ID</label>
                <input type="text" id="utrInput" placeholder="Enter UTR after payment" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:border-yellow-500 outline-none">
            </div>

            <button id="submitBtn" onclick="submitRecharge()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-600 hover:to-amber-600 text-black font-black py-3.5 rounded-xl text-xs uppercase tracking-wide transition shadow-lg">
                SUBMIT RECHARGE & UTR
            </button>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-0.5">Home</span>
        </a>
        <a href="recharge.html" class="text-yellow-400 flex flex-col items-center py-1 text-xs font-bold">
            <i class="fa-solid fa-wallet text-base"></i>
            <span class="text-[10px] mt-0.5">Recharge</span>
        </a>
        <a href="withdraw.html" class="text-gray-400 hover:text-gray-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
            <span class="text-[10px] mt-0.5">Withdraw</span>
        </a>
        <a href="profile.html" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center py-1 text-xs">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
    </div>

</body>
</html>
