<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Customer Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header i {
            cursor: pointer;
            font-size: 18px;
        }
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
        }
        .msg.bot {
            background: #1f2937;
            color: #e2e8f0;
            align-self: flex-start;
            border: 1px solid #374151;
        }
        .msg.user {
            background: #fbbf24;
            color: #111827;
            align-self: flex-end;
            font-weight: 500;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 5px 0;
        }
        .option-btn {
            background: #1f2937;
            color: #fbbf24;
            border: 1px solid #fbbf24;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #fbbf24;
            color: #111827;
        }
        .chat-input-area {
            background: #111827;
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #1f2937;
        }
        .chat-input-area input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .chat-input-area input:focus {
            border-color: #fbbf24;
        }
        .chat-input-area button {
            background: #fbbf24;
            color: #111827;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .time-stamp {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
        <span>Customer Service Support</span>
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Messages will load dynamically here -->
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button onclick="sendUserMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script>
        const userId = localStorage.getItem('user_phone') || 'User_7359679116';

        // Load existing chat history including admin replies when page opens
        function loadUserChatHistory() {
            const complaints = JSON.parse(localStorage.getItem('admin_complaints')) || [];
            let userThread = complaints.find(c => c.userId === userId);
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';

            if (!userThread || userThread.messages.length === 0) {
                // Default Welcome Message & Options if no chat started
                chatContainer.innerHTML = `
                    <div class="msg bot">
                        Hello! Welcome to TitanBuild Support. Please select your issue below:
                        <div class="time-stamp">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                        <div class="options-container" id="optionsBox">
                            <button class="option-btn" onclick="selectOption('Recharge Problem (Amount not added)')">1. Recharge Problem (Amount not added)</button>
                            <button class="option-btn" onclick="selectOption('Withdrawal Problem (Not received yet)')">2. Withdrawal Problem (Not received yet)</button>
                            <button class="option-btn" onclick="selectOption('Other Issue / General Support')">3. Other Issue / General Support</button>
                        </div>
                    </div>
                `;
            } else {
                // Render all previous messages
                userThread.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `msg ${msg.sender}`;
                    div.innerHTML = `${msg.text} <div class="time-stamp">${msg.time}</div>`;
                    chatContainer.appendChild(div);
                });
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function saveMessageToStorage(sender, text) {
            let complaints = JSON.parse(localStorage.getItem('admin_complaints')) || [];
            let userThread = complaints.find(c => c.userId === userId);
            if (!userThread) {
                userThread = { userId: userId, messages: [] };
                complaints.push(userThread);
            }
            let timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            userThread.messages.push({ sender: sender, text: text, time: timeStr });
            localStorage.setItem('admin_complaints', JSON.stringify(complaints));
        }

        function selectOption(optionText) {
            saveMessageToStorage('user', optionText);
            saveMessageToStorage('bot', 'Please show your problem in detail.');
            loadUserChatHistory();
        }

        function sendUserMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            saveMessageToStorage('user', text);
            inputField.value = '';
            loadUserChatHistory();
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendUserMessage();
            }
        });

        // Auto refresh chat every 2 seconds to see admin replies live
        setInterval(loadUserChatHistory, 2000);

        window.onload = function() {
            loadUserChatHistory();
        };
    </script>
</body>
</html>
