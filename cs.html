<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Customer Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .header i {
            cursor: pointer;
            font-size: 18px;
        }
        /* Chat Box Container */
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 70px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.user {
            background: #fbbf24;
            color: #111827;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.admin {
            background: #111827;
            color: #fff;
            align-self: flex-start;
            border: 1px solid #1f2937;
            border-bottom-left-radius: 2px;
        }
        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }
        .file-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            margin-top: 5px;
            color: inherit;
            text-decoration: none;
            font-size: 12px;
        }
        /* Chat Input Bar */
        .chat-input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111827;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-top: 1px solid #1f2937;
            gap: 10px;
        }
        .chat-input-bar label {
            color: #fbbf24;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .chat-input-bar input[type="file"] {
            display: none;
        }
        .chat-input-bar input[type="text"] {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 10px 14px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .chat-input-bar input[type="text"]:focus {
            border-color: #fbbf24;
        }
        .send-btn {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
        <span>Customer Support Chat</span>
        <i class="fas fa-headset"></i>
    </div>

    <!-- Messages Container -->
    <div class="chat-container" id="chatContainer">
        <div class="message admin">
            Hello! Welcome to TitanBuild support. How can we help you today? Send your queries or documents here.
        </div>
    </div>

    <!-- Chat Input Form -->
    <div class="chat-input-bar">
        <!-- Attachment Option for Photos, Videos, PDFs -->
        <label for="fileInput" title="Attach Photo, Video or PDF">
            <i class="fas fa-paperclip"></i>
        </label>
        <input type="file" id="fileInput" accept="image/*,video/*,.pdf" onchange="handleFileUpload(event)">
        
        <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        
        <button class="send-btn" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script>
        // Load existing messages from localStorage
        window.onload = function() {
            loadMessages();
        };

        function loadMessages() {
            const container = document.getElementById('chatContainer');
            let messages = JSON.parse(localStorage.getItem('titan_support_chats')) || [];
            
            // Keep default welcome message, append stored ones
            messages.forEach(msg => {
                appendMessageToUI(msg);
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const msgObj = {
                sender: 'user',
                type: 'text',
                content: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            saveAndDisplayMessage(msgObj);
            input.value = '';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                let fileType = 'file';
                if (file.type.startsWith('image/')) fileType = 'image';
                else if (file.type.startsWith('video/')) fileType = 'video';
                else if (file.type === 'application/pdf') fileType = 'pdf';

                const msgObj = {
                    sender: 'user',
                    type: fileType,
                    content: base64Data,
                    fileName: file.name,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                saveAndDisplayMessage(msgObj);
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // Reset input
        }

        function saveAndDisplayMessage(msgObj) {
            let messages = JSON.parse(localStorage.getItem('titan_support_chats')) || [];
            messages.push(msgObj);
            localStorage.setItem('titan_support_chats', JSON.stringify(messages));

            appendMessageToUI(msgObj);
        }

        function appendMessageToUI(msg) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${msg.sender}`;

            if (msg.type === 'text') {
                div.innerHTML = `${msg.content} <div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
            } else if (msg.type === 'image') {
                div.innerHTML = `<img src="${msg.content}" alt="Image"><div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
            } else if (msg.type === 'video') {
                div.innerHTML = `<video controls src="${msg.content}"></video><div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
            } else if (msg.type === 'pdf' || msg.type === 'file') {
                div.innerHTML = `<a href="${msg.content}" target="_blank" class="file-attachment"><i class="fas fa-file-pdf" style="font-size:18px; color:#ef4444;"></i> <span>${msg.fileName || 'View Document'}</span></a><div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
