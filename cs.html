<script>
    window.onload = function() {
        loadMessages();
    };

    function loadMessages() {
        let messages = JSON.parse(localStorage.getItem('titan_support_chats')) || [];
        messages.forEach(msg => {
            appendMessageToUI(msg);
        });
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const msgObj = {
            sender: 'user',
            type: 'text',
            content: text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        saveAndDisplayMessage(msgObj);
        input.value = '';
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        
        if (file.type.startsWith('image/')) {
            // Image compression to prevent memory overflow
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    const msgObj = {
                        sender: 'user',
                        type: 'image',
                        content: compressedDataUrl,
                        fileName: file.name,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };

                    saveAndDisplayMessage(msgObj);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            // For PDFs or other files
            reader.onload = function(e) {
                const msgObj = {
                    sender: 'user',
                    type: 'pdf',
                    content: e.target.result,
                    fileName: file.name,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                saveAndDisplayMessage(msgObj);
            };
            reader.readAsDataURL(file);
        }
        event.target.value = '';
    }

    function saveAndDisplayMessage(msgObj) {
        try {
            let messages = JSON.parse(localStorage.getItem('titan_support_chats')) || [];
            messages.push(msgObj);
            localStorage.setItem('titan_support_chats', JSON.stringify(messages));
            appendMessageToUI(msgObj);
        } catch (error) {
            alert('Storage is full or file is too large. Please try a smaller file.');
        }
    }

    function appendMessageToUI(msg) {
        const container = document.getElementById('chatContainer');
        const div = document.createElement('div');
        div.className = `message ${msg.sender}`;

        if (msg.type === 'text') {
            div.innerHTML = `${msg.content} <div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
        } else if (msg.type === 'image') {
            div.innerHTML = `<img src="${msg.content}" alt="Image"><div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
        } else if (msg.type === 'video') {
            div.innerHTML = `<video controls src="${msg.content}"></video><div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
        } else if (msg.type === 'pdf' || msg.type === 'file') {
            div.innerHTML = `<a href="${msg.content}" target="_blank" class="file-attachment"><i class="fas fa-file-pdf" style="font-size:18px; color:#ef4444;"></i> <span>${msg.fileName || 'View Document'}</span></a><div style="font-size:9px; color:#94a3b8; text-align:right; margin-top:2px;">${msg.time}</div>`;
        }

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>
