<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Live Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #111827;
            color: #fbbf24;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.bot {
            background: #1f2937;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background: #fbbf24;
            color: #111827;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }
        /* Quick Option Buttons */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }
        .option-btn {
            background: #1e293b;
            color: #229ed9;
            border: 1px solid #229ed9;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #229ed9;
            color: #fff;
        }
        /* Chat Input Footer */
        .chat-footer {
            background: #111827;
            padding: 12px;
            display: flex;
            gap: 10px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            border-top: 1px solid #1f2937;
        }
        .chat-input {
            flex: 1;
            padding: 10px 14px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .chat-input:focus {
            border-color: #fbbf24;
        }
        .send-btn {
            background: #fbbf24;
            color: #111827;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        TitanBuild Live Support
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Initial Bot Greeting with Options -->
        <div class="message bot">
            Hello! Welcome to TitanBuild Support. Please select your issue below so we can assist you quickly:
            <div class="options-container">
                <button class="option-btn" onclick="sendOption('Withdrawal Issue')">💸 Withdrawal Issue</button>
                <button class="option-btn" onclick="sendOption('Product Buy Issue')">🛒 Product Buy Issue</button>
                <button class="option-btn" onclick="sendOption('Other Problem')">⚙️ Other Problem</button>
            </div>
        </div>
    </div>

    <div class="chat-footer">
        <input type="text" class="chat-input" id="messageInput" placeholder="Type your message...">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script>
        // Get User ID from localStorage (or set a dummy demo ID if not logged in)
        const userId = localStorage.getItem('user_phone') || 'User_7359679116';

        function appendMessage(text, sender) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function saveToAdminComplaints(text) {
            let complaints = JSON.parse(localStorage.getItem('admin_complaints')) || [];
            
            // Check if user thread already exists, else create new
            let userThread = complaints.find(c => c.userId === userId);
            if (!userThread) {
                userThread = { userId: userId, messages: [] };
                complaints.push(userThread);
            }
            
            userThread.messages.push({ sender: 'user', text: text, time: new Date().toLocaleTimeString() });
            
            // Bot auto-reply logic
            userThread.messages.push({ sender: 'bot', text: 'Please show your problem in detail.', time: new Date().toLocaleTimeString() });

            localStorage.setItem('admin_complaints', JSON.stringify(complaints));
        }

        function sendOption(optionText) {
            appendMessage(optionText, 'user');
            saveToAdminComplaints(optionText);

            // Trigger bot auto-reply after a short delay
            setTimeout(() => {
                appendMessage('Please show your problem in detail.', 'bot');
            }, 600);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            appendMessage(text, 'user');
            saveToAdminComplaints(text);
            input.value = '';

            setTimeout(() => {
                appendMessage('Please show your problem in detail.', 'bot');
            }, 600);
        }
    </script>
</body>
</html>
