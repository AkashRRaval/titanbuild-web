<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TitanBuild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC89zMGIcD6Gi-KuNzP7xlRsqfj0gtXhDo",
            authDomain: "titanbuild-1509e.firebaseapp.com",
            projectId: "safargo-55e25",
            storageBucket: "titanbuild-1509e.firebasestorage.app",
            messagingSenderId: "740130026137",
            appId: "1:740130026137:web:ca74a4ca8c72b537efbe08",
            measurementId: "G-70T3E080HM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async function(event) {
            event.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!phone || !password) {
                alert('Please enter phone number and password!');
                return;
            }

            try {
                const userRef = doc(db, "users", phone);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    alert('Phone number not registered! Please register first.');
                    window.location.href = 'register.html';
                    return;
                }

                const userData = userSnap.data();

                if (userData.password !== password) {
                    alert('Incorrect password! Please try again.');
                    return;
                }

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userPhone', phone);
                localStorage.setItem('loginTime', Date.now());

                alert('Login Successful!');
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Login error: ", error);
                alert('Login failed. Please check your internet connection.');
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-yellow-400 tracking-wider">TITANBUILD</h1>
            <p class="text-xs text-gray-400">Login to your account</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Phone Number</label>
                <div class="flex items-center bg-gray-950 border border-gray-800 rounded-xl px-3 focus-within:border-yellow-500">
                    <span class="text-gray-400 text-sm font-bold mr-2">+91</span>
                    <input type="tel" id="loginPhone" placeholder="Enter phone number" pattern="[0-9]{10}" maxlength="10" required class="w-full bg-transparent py-3 text-sm text-white focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3.5 rounded-xl text-sm shadow-lg transition uppercase tracking-wide">
                Login
            </button>
        </form>

        <div class="text-center text-xs text-gray-400">
            Don't have an account? <a href="register.html" class="text-yellow-400 font-bold hover:underline">Register here</a>
        </div>
    </div>

</body>
</html>
