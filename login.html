<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area i {
            font-size: 40px;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .logo-area h2 {
            color: #fff;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #fbbf24;
        }
        .btn-login {
            background: #fbbf24;
            color: #111827;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-login:hover {
            background: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <i class="fas fa-shield-alt"></i>
            <h2>TitanBuild Login</h2>
        </div>
        
        <div class="input-group">
            <label>Phone Number / Username</label>
            <input type="text" id="loginUser" placeholder="Enter your phone or username">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Enter your password">
        </div>
        
        <button class="btn-login" onclick="handleLogin()">Login Now</button>
    </div>

    <script>
        // Check if user is already logged in using profile's expected session key
        window.onload = function() {
            if(localStorage.getItem('currentUserPhone')) {
                window.location.href = 'profile.html';
            }
        };

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if(!user || !pass) {
                alert("Please enter both username and password!");
                return;
            }

            // Fix: Setting 'currentUserPhone' so profile.html security guard recognizes it correctly
            localStorage.setItem('currentUserPhone', user);

            alert("Login successful!");
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
