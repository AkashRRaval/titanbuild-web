<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe6eJF8ISMX2oqNEhMtSZhONQCIPG_Lb8",
            authDomain: "titanbuildlive.firebaseapp.com",
            projectId: "titanbuildlive",
            storageBucket: "titanbuildlive.firebasestorage.app",
            messagingSenderId: "190147437260",
            appId: "1:190147437260:web:2c8cc81a4180bb9ac09869",
            measurementId: "G-TGB7V2M7XF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async function() {
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!phone || !password) {
                alert('Please enter both mobile number and password.');
                return;
            }

            try {
                const userRef = doc(db, "users", phone);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    alert('Phone number not registered! Please register first.');
                    window.location.href = 'register.html';
                    return;
                }

                const userData = userSnap.data();

                if (userData.password !== password) {
                    alert('Incorrect password! Please try again.');
                    return;
                }

                // Save session in localStorage
                localStorage.setItem('titanUserPhone', phone);

                alert('Login successful!');
                window.location.href = 'index.html';

            } catch (e) {
                console.error("Login error:", e);
                alert('Login failed. Please check your internet connection.');
            }
        };
    </script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-6 rounded-3xl shadow-2xl space-y-5">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-gradient-to-tr from-yellow-600 to-amber-400 rounded-2xl flex items-center justify-center text-black font-black mx-auto shadow-lg text-xl">
                <i class="fa-solid fa-helmet-safety"></i>
            </div>
            <h1 class="text-lg font-black tracking-wider text-yellow-400 uppercase">Welcome Back</h1>
            <p class="text-xs text-gray-400">Login to your TitanBuild account</p>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Mobile Number</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-gray-500 text-xs font-bold">+91</span>
                    <input type="tel" id="loginPhone" maxlength="10" placeholder="Enter your mobile number" class="w-full bg-gray-950 border border-gray-800 rounded-2xl py-3 pl-12 pr-4 text-xs text-white focus:outline-none focus:border-yellow-500 font-bold">
                </div>
            </div>

            <div>
                <label class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Password</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-gray-500 text-xs"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="loginPassword" placeholder="Enter your password" class="w-full bg-gray-950 border border-gray-800 rounded-2xl py-3 pl-10 pr-4 text-xs text-white focus:outline-none focus:border-yellow-500 font-bold">
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-600 hover:to-amber-600 text-black font-black py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg mt-2">
                LOGIN NOW
            </button>
        </div>

        <!-- Footer Link -->
        <div class="text-center pt-2 border-t border-gray-800">
            <p class="text-xs text-gray-400">Don't have an account? <a href="register.html" class="text-yellow-400 font-bold hover:underline">Register here</a></p>
        </div>

    </div>

</body>
</html>
