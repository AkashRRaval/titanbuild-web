<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanBuild - Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl border border-gray-700">
        <!-- Logo Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-500 text-black rounded-2xl mb-2 text-3xl font-black">
                <i class="fa-solid fa-helmet-safety"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wide text-yellow-400">TitanBuild</h1>
            <p class="text-xs text-gray-400 mt-1">Heavy Machinery Equipment Platform</p>
        </div>

        <!-- Form Tabs -->
        <div class="flex bg-gray-900 p-1 rounded-xl mb-6 border border-gray-700 text-sm font-bold">
            <button id="loginTab" onclick="switchTab('login')" class="flex-1 bg-yellow-500 text-black py-2 rounded-lg text-center shadow">Login</button>
            <button id="registerTab" onclick="switchTab('register')" class="flex-1 text-gray-400 py-2 rounded-lg text-center">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-xs text-gray-400 block mb-1">Mobile Number</label>
                <div class="flex bg-gray-900 rounded-lg border border-gray-700 overflow-hidden">
                    <span class="bg-gray-800 text-yellow-400 px-3 py-2.5 text-sm font-bold flex items-center">+91</span>
                    <input type="tel" placeholder="Enter 10 digit number" class="bg-transparent w-full p-2.5 text-sm focus:outline-none">
                </div>
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">Password</label>
                <input type="password" placeholder="Enter password" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none">
            </div>

            <button type="button" onclick="alert('Login Successful!')" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-extrabold py-3 rounded-lg shadow-lg text-sm transition">
                LOG IN
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label class="text-xs text-gray-400 block mb-1">Mobile Number</label>
                <div class="flex bg-gray-900 rounded-lg border border-gray-700 overflow-hidden">
                    <span class="bg-gray-800 text-yellow-400 px-3 py-2.5 text-sm font-bold flex items-center">+91</span>
                    <input type="tel" placeholder="Enter 10 digit number" class="bg-transparent w-full p-2.5 text-sm focus:outline-none">
                </div>
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">Create Password</label>
                <input type="password" placeholder="Set password" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none">
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">Invite Code (Optional)</label>
                <input type="text" placeholder="Enter referral code" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none">
            </div>

            <button type="button" onclick="alert('Registration Successful!')" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-extrabold py-3 rounded-lg shadow-lg text-sm transition">
                CREATE ACCOUNT
            </button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.className = "flex-1 bg-yellow-500 text-black py-2 rounded-lg text-center shadow";
                registerTab.className = "flex-1 text-gray-400 py-2 rounded-lg text-center";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTab.className = "flex-1 bg-yellow-500 text-black py-2 rounded-lg text-center shadow";
                loginTab.className = "flex-1 text-gray-400 py-2 rounded-lg text-center";
            }
        }
    </script>
</body>
</html>
